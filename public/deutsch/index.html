<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<title>Deutsch A1 Trainer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Crect x='10' y='14' width='44' height='12' fill='%23111'/%3E%3Crect x='10' y='26' width='44' height='12' fill='%23DD0000'/%3E%3Crect x='10' y='38' width='44' height='12' fill='%23FFCE00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --sunk: #F0F2F5; --ink: #12151C; --ink2: #2B303B; --muted: #646B7A; --line: #E2E5EA; --line2: #D3D7DE;
  --accent: #3555E8; --accent-ink: #FFFFFF; --accent-soft: #E9EDFE; --accent-line: #C9D3FB;
  --good: #14804A; --good-soft: #E3F4EA; --bad: #C2362B; --bad-soft: #FBE7E5; --warn: #A15C07; --warn-soft: #FDF1DD;
  --der: #2563EB; --das: #15803D; --die: #DC2626; --pl: #B7791F;
  --r: 14px; --r-sm: 10px;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg: 0 12px 32px rgba(16,24,40,.14), 0 2px 6px rgba(16,24,40,.08);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar: 0px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1116; --surface: #161A21; --sunk: #1C2129; --ink: #E8EAF0; --ink2: #CBD0DA; --muted: #9098A8; --line: #262C36; --line2: #323A46;
  --accent: #7C93FF; --accent-ink: #0E1116; --accent-soft: #1E2648; --accent-line: #34407A;
  --good: #4CC38A; --good-soft: #13291F; --bad: #FF7B72; --bad-soft: #351A19; --warn: #F0B35A; --warn-soft: #33260F;
  --der: #6EA0FF; --das: #4CC38A; --die: #FF7B72; --pl: #E9B949;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.55);
} }
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #161A21; --sunk: #1C2129; --ink: #E8EAF0; --ink2: #CBD0DA; --muted: #9098A8; --line: #262C36; --line2: #323A46;
  --accent: #7C93FF; --accent-ink: #0E1116; --accent-soft: #1E2648; --accent-line: #34407A;
  --good: #4CC38A; --good-soft: #13291F; --bad: #FF7B72; --bad-soft: #351A19; --warn: #F0B35A; --warn-soft: #33260F;
  --der: #6EA0FF; --das: #4CC38A; --die: #FF7B72; --pl: #E9B949;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -0.015em; margin: 0; }
h1 { font-size: 26px; font-weight: 800; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden { display: none !important; }

/* ── Top bar ── */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; padding-top: max(10px, env(safe-area-inset-top)); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; color: var(--ink); font-size: 16px; white-space: nowrap; }
.flag { width: 22px; height: 16px; border-radius: 3px; background: linear-gradient(#111 0 33.3%, #DD0000 33.3% 66.6%, #FFCE00 66.6%); box-shadow: 0 0 0 1px var(--line); }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav a { padding: 7px 12px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 14px; }
.nav a:hover { color: var(--ink); background: var(--sunk); }
.nav a.on { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; }
.iconbtn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; }
.iconbtn:hover { border-color: var(--line2); }

/* ── Mobile tab bar ── */
.tabbar { display: none; }
@media (max-width: 760px) {
  :root { --tabbar: 62px; }
  .nav { display: none; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 0 7px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .tabbar a .ti { font-size: 19px; line-height: 1.1; filter: grayscale(1); opacity: .75; }
  .tabbar a.on { color: var(--accent); }
  .tabbar a.on .ti { filter: none; opacity: 1; }
  .hide-m { display: none !important; }
}

/* ── Layout ── */
main { max-width: 1040px; margin: 0 auto; padding: 22px 16px calc(110px + var(--tabbar) + env(safe-area-inset-bottom)); }
.page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head .grow { flex: 1; min-width: 220px; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: inline-flex; gap: 6px; align-items: center; }
.crumb a { color: var(--muted); }
.crumb a:hover { color: var(--ink); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 860px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .g2:not(.keep), .g3 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.tight { padding: 14px; }
.card.link { cursor: pointer; transition: border-color .15s, transform .15s; color: inherit; display: block; }
.card.link:hover { border-color: var(--accent-line); transform: translateY(-1px); }
.sec { margin: 28px 0 12px; display: flex; align-items: baseline; gap: 10px; }
.sec h2 { flex: 1; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.sp { flex: 1; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border-radius: 11px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; cursor: pointer; transition: background .12s, border-color .12s, transform .05s; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 9px; }
.btn.lg { padding: 13px 20px; font-size: 16px; border-radius: 13px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ── Progress ── */
.bar { height: 7px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s; }
.bar.good > i { background: var(--good); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.stat span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--sunk) 0); display: grid; place-items: center; flex: none; }
.ring::before { content: ""; grid-area: 1/1; width: 50px; height: 50px; border-radius: 50%; background: var(--surface); }
.ring span { grid-area: 1/1; font-weight: 800; font-size: 14px; z-index: 1; }

/* ── Hero ── */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.hero .main { background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #7c3aed) 100%); color: #fff; border: 0; }
.hero .main .muted { color: rgba(255,255,255,.82); }
.hero .main .btn { background: #fff; color: #1b2340; border-color: #fff; }
.hero .main .btn.ghost { background: rgba(255,255,255,.14); color: #fff; border-color: transparent; }

/* ── Lesson list ── */
.lesson { display: flex; gap: 14px; align-items: center; }
.lesson .em { width: 48px; height: 48px; border-radius: 13px; background: var(--sunk); display: grid; place-items: center; font-size: 25px; flex: none; }
.lesson .t { flex: 1; min-width: 0; }
.lesson .t b { display: block; font-size: 15px; }
.lesson .t small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lesson .bar { margin-top: 8px; }
.lnum { font-size: 11.5px; font-weight: 700; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }

/* ── Tabs ── */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 12px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: 1; text-align: center; padding: 8px 10px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
.tabs a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ── Theory ── */
.theory h3 { margin: 0 0 10px; font-size: 17px; }
.theory p { color: var(--ink2); }
.de { color: var(--accent); font-weight: 600; cursor: pointer; border-bottom: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); }
.de:hover { background: var(--accent-soft); border-radius: 3px; }
.tbl { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: 14.5px; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tblwrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.ex { list-style: none; padding: 0; margin: 8px 0 0; }
.ex li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.ex li:first-child { border-top: 0; }
.ex .exde { font-weight: 600; }
.ex .exen { color: var(--muted); font-size: 14px; }
.tip { margin-top: 12px; padding: 11px 13px; border-radius: 11px; background: var(--warn-soft); color: var(--ink2); font-size: 14.5px; border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }
.tip::before { content: "💡 "; }
.say { width: 30px; height: 30px; flex: none; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-grid; place-items: center; font-size: 14px; }
.say:hover { border-color: var(--accent-line); background: var(--accent-soft); }

/* ── Words ── */
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.word { display: flex; gap: 11px; align-items: center; padding: 11px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.word .pic { font-size: 26px; width: 36px; text-align: center; flex: none; }
.word .w { flex: 1; min-width: 0; }
.word .w b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.word .w small { color: var(--muted); font-size: 13px; display: block; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line2); }
.dots i.on { background: var(--good); }
.g-der { color: var(--der); } .g-das { color: var(--das); } .g-die { color: var(--die); } .g-pl { color: var(--pl); }
.input { width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--line2); background: var(--surface); outline: none; font-size: 16px; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 220px; resize: vertical; line-height: 1.55; }

/* ── Quiz ── */
.quiz { max-width: 640px; margin: 0 auto; }
.qtop { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.qtop .bar { flex: 1; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.qkind { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.qprompt { font-size: 21px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; overflow-wrap: anywhere; }
.qsub { color: var(--muted); margin-bottom: 16px; }
.qpic { font-size: 64px; text-align: center; margin: 4px 0 10px; }
.opts { display: grid; gap: 9px; margin-top: 16px; }
.opts.g2 { grid-template-columns: 1fr 1fr; }
.opt { text-align: left; padding: 13px 15px; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15.5px; display: flex; gap: 11px; align-items: center; transition: border-color .1s, background .1s; }
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line2); display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--muted); flex: none; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.gender .opt { justify-content: center; font-size: 19px; font-weight: 700; }
.gender .opt:nth-child(1) { color: var(--der); } .gender .opt:nth-child(2) { color: var(--das); } .gender .opt:nth-child(3) { color: var(--die); }
.fb { margin-top: 14px; border-radius: 13px; padding: 13px 15px; font-size: 15px; }
.fb.ok { background: var(--good-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
.fb.no { background: var(--bad-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.fb b.t { display: block; margin-bottom: 3px; }
.fb.ok b.t { color: var(--good); } .fb.no b.t { color: var(--bad); }
.qactions { display: flex; gap: 10px; margin-top: 16px; }
.qactions .btn.primary { flex: 1; }
.tokens { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 10px; border-radius: 12px; border: 1.5px dashed var(--line2); background: var(--sunk); }
.tokens.pool { background: transparent; border-color: transparent; padding: 10px 0; }
.tok { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); cursor: pointer; font-weight: 600; box-shadow: var(--shadow); }
.tok:hover { border-color: var(--accent); }
.big-say { width: 84px; height: 84px; border-radius: 50%; margin: 6px auto 4px; display: grid; place-items: center; font-size: 34px; cursor: pointer; border: 0; background: var(--accent-soft); color: var(--accent); }
.big-say:hover { filter: brightness(.97); }

/* ── Flashcards ── */
.fc { perspective: 1200px; max-width: 520px; margin: 0 auto; }
.fc-card { position: relative; height: 300px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1); cursor: pointer; }
.fc-card.flip { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px; text-align: center; gap: 8px; }
.fc-back { transform: rotateY(180deg); }
.fc-face .pic { font-size: 60px; line-height: 1; }
.fc-face .de-big { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.fc-face .en-big { font-size: 22px; font-weight: 600; color: var(--ink2); }
.fc-hint { position: absolute; bottom: 14px; left: 0; right: 0; font-size: 12.5px; color: var(--muted); }
.fc-rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; max-width: 520px; margin: 16px auto 0; }

/* ── Clock ── */
.clock { display: block; margin: 6px auto 10px; width: 150px; height: 150px; }
.clock .face { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }
.clock .tick { stroke: var(--muted); stroke-width: 2; }
.clock .hh { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.clock .mh { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }

/* ── Exam ── */
.passage { background: var(--sunk); border-radius: 13px; padding: 15px 17px; font-size: 15.5px; line-height: 1.65; }
.passage p { margin: 0 0 10px; }
.passage p:last-child { margin: 0; }
.qblock { padding: 13px 0; border-top: 1px solid var(--line); }
.qblock:first-child { border-top: 0; }
.qblock .qq { font-weight: 600; margin-bottom: 9px; }
.pills { display: flex; flex-wrap: wrap; gap: 7px; }
.pill { padding: 7px 13px; border-radius: 999px; border: 1.5px solid var(--line2); background: var(--surface); cursor: pointer; font-size: 14.5px; font-weight: 500; }
.pill:hover:not([disabled]) { border-color: var(--accent); }
.pill.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.pill.ok { border-color: var(--good); background: var(--good-soft); }
.pill.no { border-color: var(--bad); background: var(--bad-soft); }
.expl { font-size: 13.5px; color: var(--muted); margin-top: 7px; }
.expl.ok { color: var(--good); } .expl.no { color: var(--bad); }
.score { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--muted); }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.lines { list-style: none; padding: 0; margin: 0; }
.lines li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.lines li:first-child { border-top: 0; }
.lines .who { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; background: var(--accent-soft); color: var(--accent); margin-top: 2px; }
.lines .who.b { background: var(--warn-soft); color: var(--warn); }
.lines li.now { background: var(--accent-soft); border-radius: 9px; }
.memo .txt.blur { filter: blur(5px); user-select: none; }
.memo .txt.first { letter-spacing: .02em; }

/* ── AI ── */
.fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(18px + var(--tabbar) + env(safe-area-inset-bottom)); z-index: 60; height: 52px; padding: 0 18px 0 15px; border-radius: 26px; border: 0; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: var(--shadow-lg); -webkit-user-select: none; user-select: none; }
.fab .spark { font-size: 18px; }
.fab.on { background: var(--accent); color: var(--accent-ink); }
.ai { position: fixed; z-index: 70; right: 16px; bottom: calc(80px + var(--tabbar) + env(safe-area-inset-bottom)); width: min(420px, calc(100vw - 32px)); height: min(620px, calc(100vh - 150px - var(--tabbar))); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
@media (max-width: 760px) {
  .ai { left: 8px; right: 8px; width: auto; bottom: calc(76px + var(--tabbar) + env(safe-area-inset-bottom)); height: min(70vh, calc(100vh - 170px)); }
}
.ai-head { display: flex; align-items: center; gap: 8px; padding: 11px 12px 11px 16px; border-bottom: 1px solid var(--line); }
.ai-head b { flex: 1; font-size: 15px; }
.ai-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 14px; font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; }
.msg.u { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
.msg.a { align-self: flex-start; background: var(--sunk); border-bottom-left-radius: 5px; }
.msg.a strong { color: var(--accent); cursor: pointer; }
.msg.a p { margin: 0 0 8px; } .msg.a p:last-child { margin: 0; }
.msg.a ul, .msg.a ol { margin: 4px 0 8px; padding-left: 20px; }
.msg.a table { border-collapse: collapse; margin: 6px 0; font-size: 13.5px; }
.msg.a td, .msg.a th { border: 1px solid var(--line2); padding: 4px 7px; }
.msg.a h4 { margin: 8px 0 4px; font-size: 14.5px; }
.msg.a code { background: var(--surface); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.msg .pick { display: block; font-size: 12.5px; opacity: .85; margin-bottom: 4px; }
.ai-empty { color: var(--muted); font-size: 14px; text-align: center; margin: auto 10px; }
.ai-empty b { color: var(--ink); display: block; font-size: 16px; margin-bottom: 6px; }
.ai-quick { display: flex; gap: 6px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
.ai-quick::-webkit-scrollbar { display: none; }
.ai-quick button { flex: none; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line2); background: var(--surface); cursor: pointer; font-size: 12.5px; font-weight: 600; }
.ai-quick button:hover { border-color: var(--accent); }
.ai-picked { margin: 0 12px 8px; padding: 7px 10px; border-radius: 10px; background: var(--accent-soft); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.ai-picked span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-form { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
.ai-form textarea { flex: 1; resize: none; height: 44px; max-height: 120px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); outline: none; font-size: 15px; line-height: 1.35; }
.ai-form textarea:focus { border-color: var(--accent); }
.ai-form .btn { padding: 0 14px; }
.pickbar { position: fixed; z-index: 75; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top)); background: var(--ink); color: var(--bg); padding: 10px 14px 10px 16px; border-radius: 14px; box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 600; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 24px); }
.pickbar button { background: rgba(255,255,255,.16); color: inherit; border: 0; border-radius: 9px; padding: 5px 10px; font-weight: 700; cursor: pointer; }
:root[data-theme="dark"] .pickbar button, .pickbar button { background: color-mix(in srgb, var(--bg) 20%, transparent); }
body.picking main { cursor: crosshair; }
body.picking main *:hover { outline: 2px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
body.picking .ai .ai-msgs, body.picking .ai .ai-quick { display: none; }
body.picking .ai { height: auto; }
.ai-flash { outline: 3px solid var(--accent) !important; outline-offset: 3px; border-radius: 6px; transition: outline-color .6s; }
.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }

/* ── Modal & toast ── */
.modal-bg { position: fixed; inset: 0; background: rgba(10,12,18,.42); z-index: 90; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: min(460px, 100%); box-shadow: var(--shadow-lg); max-height: calc(100vh - 32px); overflow: auto; }
.field { display: block; margin: 12px 0; }
.field span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + var(--tabbar) + env(safe-area-inset-bottom)); z-index: 95; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg); animation: tin .2s; max-width: calc(100vw - 32px); }
@keyframes tin { from { opacity: 0; transform: translate(-50%, 8px); } }
.confetti { font-size: 52px; text-align: center; }
kbd { font: 600 11px var(--font); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line2); background: var(--sunk); color: var(--muted); }
</style>
