<style>
/* Same visual language as /mylife/tasks/ (light) + an APEX-like dark theme. */
:root{
  --bg:#FAFAFA; --card:#FFFFFF; --panel:#FCFCFC; --text:#111111; --muted:#8C8C8C; --faint:#C4C4C4;
  --border:rgba(0,0,0,.05); --border-strong:rgba(0,0,0,.09); --shadow:rgba(0,0,0,.05);
  --accent:#111111; --on-accent:#FFFFFF; --cell:rgba(0,0,0,.045); --hover:rgba(0,0,0,.04);
  --red:#D64545; --amber:#C98A2B; --glass:rgba(255,255,255,.72);
  --ease:cubic-bezier(.2,.8,.2,1); --r-panel:28px; --r-card:20px;
}
:root[data-theme="dark"]{
  --bg:#0A0A09; --card:#131312; --panel:#0F0F0E; --text:#EDEDE8; --muted:#8A8A84; --faint:#45453F;
  --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.11); --shadow:rgba(0,0,0,.4);
  --accent:#D6A84A; --on-accent:#0A0A09; --cell:rgba(255,255,255,.05); --hover:rgba(255,255,255,.05);
  --red:#E0605A; --amber:#D6A84A; --glass:rgba(19,19,18,.72);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;transition:background .25s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;padding:0}
::placeholder{color:var(--faint)}
::selection{background:rgba(17,17,17,.12)}
svg{display:block}
.muted{color:var(--muted)}

.page{max-width:1320px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 40px 80px}

/* ── Hero ── */
.hero{display:flex;gap:32px;align-items:flex-start;margin-bottom:36px}
.hero-main{flex:1;min-width:0}
.manifesto{margin:0;font-size:44px;line-height:1.08;font-weight:600;letter-spacing:-.035em;max-width:900px;cursor:text;white-space:pre-wrap;overflow-wrap:anywhere}
.manifesto .rest{color:var(--muted)}
:root[data-theme="dark"] .manifesto .rest{color:var(--accent)}
.manifesto-edit{width:100%;max-width:900px;margin:0;font-size:44px;line-height:1.08;font-weight:600;letter-spacing:-.035em;resize:none;display:block;overflow:hidden}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.rail{display:flex;gap:10px;flex:none}
.rail-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);color:var(--muted);box-shadow:0 8px 24px var(--shadow);transition:color .15s,background .15s;position:relative;text-decoration:none}
.rail-btn:hover{color:var(--text)}
.rail-btn svg{width:19px;height:19px}
.rail-btn .badge{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.side{position:sticky;top:24px}
.panel{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-panel);padding:32px}
.panel-head{display:flex;align-items:center;gap:12px;margin:0 0 24px 4px}
.panel-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
.panel-sub{font-size:14px;color:var(--muted);font-weight:500}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:20px}
.float{--pad:28px;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:0 24px 60px var(--shadow)}

.round{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s;flex:none}
.round:hover{background:var(--hover);color:var(--text)}
.round svg{width:18px;height:18px}
.round.solid{background:var(--accent);color:var(--on-accent)}
.round.solid:hover{opacity:.88;background:var(--accent);color:var(--on-accent)}
.pill-btn{height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;color:var(--muted);transition:background .15s,color .15s;flex:none}
.pill-btn svg{width:15px;height:15px}
.pill-btn:hover{background:var(--hover);color:var(--text)}
.pill-btn.solid{background:var(--accent);color:var(--on-accent)}
.pill-btn.solid:hover{opacity:.9}
.btn{height:48px;border-radius:14px;padding:0 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,background .15s}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{opacity:.9}
.btn.ghost{color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.block{width:100%}
.btn.soft{background:var(--cell);color:var(--text)}
.btn svg{width:17px;height:17px}
.round:disabled{opacity:.25;pointer-events:none}
.pill-btn.danger:hover{color:var(--red)}
.tm-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:22px}
.tm-top .round{margin:-6px -8px 0 0}
.tm-action{display:flex;gap:8px;margin-bottom:26px}
.tm-cal-head{display:flex;align-items:center;font-size:15px;font-weight:600;margin-bottom:8px}
.tm-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tm-cal .wd{font-size:12px;color:var(--muted);text-align:center;font-weight:500;padding-bottom:2px}
.tm-cal button,.tm-cal span{aspect-ratio:1;border-radius:12px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;position:relative;color:var(--text)}
.tm-cal button{background:var(--cell);transition:transform .15s var(--ease)}
.tm-cal button:hover{background:var(--border-strong)}
.tm-cal button:active{transform:scale(.9)}
.tm-cal span{color:var(--faint)}
.tm-cal .rest{color:var(--muted)}
.tm-cal button.rest{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.tm-cal .out{color:transparent;background:transparent;box-shadow:none}
.tm-cal .f{background:var(--accent)!important;color:var(--on-accent);box-shadow:none}
.tm-cal .td:not(.f){box-shadow:inset 0 0 0 1.5px var(--accent)}
.tm-cal sup{position:absolute;top:3px;right:5px;font-size:9px}
.tm-foot{display:flex;align-items:center;margin:22px -16px -8px}

/* ── Week grid (calendars × days) ── */
.week{width:100%;border-collapse:collapse}
.week th{font-size:12px;font-weight:500;color:var(--muted);padding:0 0 12px;text-align:center}
.week th .dn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:2px auto 0;font-size:15px;color:var(--text);font-weight:500;border-radius:50%}
.week th.today .dn{background:var(--accent);color:var(--on-accent)}
.week th:first-child{text-align:left}
.week td{border-top:1px solid var(--border);padding:12px 0;text-align:center}
.week td.name{text-align:left;padding-right:12px}
.week td.cnt{text-align:right;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;padding-left:12px;font-variant-numeric:tabular-nums}
.week td.cnt b{color:var(--text);font-weight:600}
.t-name{font-size:15px;font-weight:500;cursor:pointer;display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.t-name:hover{opacity:.7}
.t-reg{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cell{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--cell);transition:transform .15s var(--ease),background .15s;font-size:12px;font-weight:600;position:relative;vertical-align:middle}
button.cell:hover{background:var(--border-strong)}
button.cell:active{transform:scale(.88)}
.cell svg{width:14px;height:14px}
.cell.done{background:var(--accent);color:var(--on-accent)}
button.cell.done:hover{background:var(--accent);opacity:.85}
.cell.missed::after{content:'';position:absolute;width:14px;height:1.5px;background:var(--faint);transform:rotate(-45deg);border-radius:2px}
.cell.due{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell.up{background:transparent;box-shadow:inset 0 0 0 1px var(--border-strong)}
.cell.off{background:transparent}
.cell.off::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--faint)}
.cell.na{background:transparent}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:16px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .cell{width:14px;height:14px;border-radius:4px}
.legend .cell.missed::after{width:8px}
.legend .cell.off::after{width:3px;height:3px}
.week-nav{display:flex;align-items:center;gap:2px}
.week-label{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap}

/* ── Cube cards ── */
.cubes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:22px;margin-top:28px}
.tcard{min-width:0;width:100%;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.tcard:hover{transform:translateY(-2px);box-shadow:0 10px 30px var(--shadow)}
.tcard-name{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.35;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.tcard .cubes{margin-top:6px}
.today-ok{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.today-ok svg{width:11px;height:11px}
.tcard-meta{font-size:13px;color:var(--muted);margin-top:2px}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big b{font-size:44px;font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:15px;color:var(--muted);font-weight:500}
.cubes{display:flex;flex-wrap:wrap;gap:var(--g,4px)}
.cube{width:var(--c,14px);height:var(--c,14px);border-radius:calc(var(--c,14px)*.28);background:var(--cell)}
.cube.f{background:var(--accent)}
.cube.x{background:transparent;box-shadow:inset 0 0 0 1px var(--border-strong);position:relative;overflow:hidden}
.cube.x::after{content:'';position:absolute;left:50%;top:50%;width:140%;height:1px;background:var(--faint);transform:translate(-50%,-50%) rotate(-45deg)}
.cube.t{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.cube.plus{background:var(--accent);opacity:.4}
.tcard-foot{display:flex;align-items:center;gap:10px;margin-top:auto;min-height:38px}
.state{font-size:13px;color:var(--muted);flex:1}
.state.late{color:var(--red)}
.state.good{color:var(--text)}
.why{font-size:13px;color:var(--muted);line-height:1.5}
.counter{display:flex;align-items:center;gap:4px}
.counter .n{min-width:22px;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.add-hint{border:1px dashed var(--border-strong);border-radius:var(--r-card);min-height:120px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:15px;font-weight:500;transition:color .15s,border-color .15s;width:100%}
.add-hint:hover{color:var(--text);border-color:var(--muted)}
.add-hint svg{width:18px;height:18px}
.empty{padding:8px 4px 4px}
.empty-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.empty p{color:var(--muted);font-size:15px;line-height:1.55;max-width:520px;margin:8px 0 20px}
.demo-cubes{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap}
.demo-cubes i{width:18px;height:18px;border-radius:5px;background:var(--cell)}
.demo-cubes i.f{background:var(--accent)}

/* ── Month focus ── */
.intent{width:calc(100% - 4px);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.3;resize:none;overflow:hidden;display:block;margin:0 0 28px 4px}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:22px}
.proj{min-width:0;display:flex;flex-direction:column;gap:6px;min-height:200px;transition:box-shadow .18s var(--ease)}
.proj:focus-within{box-shadow:0 10px 30px var(--shadow)}
.proj-head{display:flex;align-items:center;gap:6px}
.proj-name{flex:1;font-size:18px;font-weight:600;letter-spacing:-.01em;min-width:0}
.proj-focus{font-size:14px;color:var(--muted);width:100%}
.proj-focus:focus{color:var(--text)}
.ktasks{margin:10px 0 4px;display:flex;flex-direction:column}
.ktask{display:flex;align-items:flex-start;gap:12px;padding:7px 0}
.ktask input{flex:1;font-size:15px;line-height:1.45;min-width:0}
.ktask.done input{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.ktask .del{opacity:0;width:24px;height:24px;color:var(--faint);border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.ktask:hover .del{opacity:1}
.ktask .del:hover{color:var(--red)}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--muted)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk svg{width:11px;height:11px}
.ktask.new .chk{border-style:dashed}
.notes{width:100%;font-size:14px;line-height:1.55;color:var(--muted);resize:none;overflow:hidden;display:block;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.notes:focus{color:var(--text)}
.proj-progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.saved{font-size:13px;color:var(--muted);margin-left:auto}

/* ── Check-in ── */
.ci-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.ci-sub{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.5}
/* Score wheel: swipe / drag / mouse wheel / arrows, the centred number is the value */
.wheel{position:relative;margin:0 calc(-1 * var(--pad,28px))}
.wheel::before{content:'';position:absolute;left:50%;top:10px;bottom:10px;width:76px;transform:translateX(-50%);border-radius:22px;background:var(--cell);pointer-events:none}
.wheel::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,var(--card),transparent 24%,transparent 76%,var(--card))}
.wheel-track{display:flex;align-items:center;height:96px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain;padding:0 calc(50% - 32px);cursor:grab;outline-offset:-2px}
.wheel-track::-webkit-scrollbar{display:none}
.wheel-track button{flex:none;width:64px;height:64px;scroll-snap-align:center;font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;position:relative}
.wheel-next{margin-top:18px}
.ta{width:100%;min-height:96px;resize:none;font-size:16px;line-height:1.5;border:1px solid var(--border-strong);border-radius:16px;padding:14px 16px;background:var(--bg);display:block}
.ta:focus{border-color:var(--muted)}
.ci-score{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ci-score .num{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:none}
.ci-score .lbl{font-size:14px;color:var(--muted)}
.ci-score .ttl{font-weight:600;font-size:15px}
.ci-q{font-size:17px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em;line-height:1.35}
.ci-row{display:flex;gap:8px;margin-top:14px}
.ci-row .btn.primary{flex:1}
.ci-row.stack{flex-direction:column;margin-top:20px}
.ci-row.stack .btn{flex:none}
.step-n{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.step-quote{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:6px}
.commit-text{font-size:17px;font-weight:600;line-height:1.4;letter-spacing:-.01em;margin:4px 0 4px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;border-top:1px solid var(--border);padding-top:18px}
.slot{text-align:center}
.slot .l{font-size:12px;color:var(--muted);font-weight:500}
.slot .v{font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.slot .v.none{color:var(--faint)}
.slot.cur .l{color:var(--text)}

/* ── Progress (APEX-style numbers) ── */
.prog-row{padding:18px 0;border-top:1px solid var(--border)}
.prog-row:first-of-type{border-top:0;padding-top:4px}
.prog-row .l{font-size:13px;color:var(--muted);font-weight:500}
.prog-row .big b{font-size:36px}
.prog-row .big span{font-size:14px}
.bar{height:3px;border-radius:3px;background:var(--cell);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s var(--ease)}
.dotcols{display:flex;gap:6px;margin-top:14px;align-items:flex-end}
.dotcol{display:flex;flex-direction:column-reverse;gap:3px;flex:1;align-items:center}
.dotcol i{width:6px;height:6px;border-radius:50%;background:var(--cell)}
.dotcol i.f{background:var(--accent)}
.dotcol.none i{background:transparent;box-shadow:inset 0 0 0 1px var(--cell)}
.dot-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}

/* ── Journal ── */
.jday{font-size:12px;color:var(--muted);font-weight:500;margin:18px 0 4px}
.jday:first-of-type{margin-top:0}
.jrow{display:flex;gap:12px;padding:8px 0}
.jnum{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.jnum.c{background:var(--accent);color:var(--on-accent);box-shadow:none}
.jtext{font-size:14px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.jtext .s{font-size:12px;color:var(--muted)}
.jtext .a{color:var(--muted)}
.link{font-size:14px;color:var(--muted);font-weight:500}
.link:hover{color:var(--text)}

/* ── Modal ── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.18);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:80;opacity:0;transition:opacity .2s}
:root[data-theme="dark"] .backdrop{background:rgba(0,0,0,.6)}
.backdrop.show{opacity:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;z-index:90;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.16);transition:transform .25s var(--ease),opacity .2s}
.modal.show{transform:translate(-50%,-50%);opacity:1}
.modal h3{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 22px}
.m-name{width:100%;font-size:20px;font-weight:500;padding:4px 0 14px;border-bottom:1px solid var(--border-strong);margin-bottom:22px}
.m-name:focus{border-bottom-color:var(--muted)}
.m-field{margin-bottom:22px}
.m-label{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:10px;display:block}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border-strong);transition:all .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.wd-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.wd-row button{width:40px;height:40px;border-radius:50%;font-size:13px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border-strong)}
.wd-row button.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.stepper{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px;color:var(--muted);line-height:1.4}
.stepper .round{box-shadow:inset 0 0 0 1px var(--border-strong)}
.stepper b{font-size:20px;color:var(--text);font-weight:600;min-width:20px;text-align:center}
.inline-in{height:42px;border-radius:12px;border:1px solid var(--border-strong);padding:0 12px;font-size:15px;background:var(--bg)}
.inline-in:focus{border-color:var(--muted)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dates label{font-size:12px;color:var(--muted)}
.dates input{width:100%;margin-top:4px;color-scheme:light}
:root[data-theme="dark"] .dates input{color-scheme:dark}
.preview{border-radius:16px;background:var(--bg);padding:16px;margin-bottom:22px}
.preview-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px;gap:10px}
.preview-top b{font-weight:600}
.m-actions{display:flex;gap:10px;align-items:center}
.m-actions .btn.primary{flex:1}
.m-danger{display:flex;gap:4px;justify-content:center;margin-top:14px}
.m-danger .pill-btn:hover{color:var(--red)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.list-row:first-of-type{border-top:0}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--accent);color:var(--on-accent);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:all .25s var(--ease);z-index:100;pointer-events:none;box-shadow:0 24px 60px rgba(0,0,0,.16);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{padding:120px 0;text-align:center;color:var(--muted)}

/* ── Responsive ── */
@media (max-width:1080px){
  /* One column; the morning ritual order: check-in → calendars → progress → focus → journal */
  .layout{display:flex;flex-direction:column;align-items:stretch}
  .col,.side,.side-wrap{display:contents}
  #ci{order:1} #cal{order:2} #focus{order:3} #journal{order:4}
}
@media (max-width:760px){
  .page{padding:calc(20px + env(safe-area-inset-top)) 16px 60px}
  .hero{flex-direction:column-reverse;gap:14px;margin-bottom:22px}
  .rail{flex-direction:row;align-self:flex-end;gap:8px}
  .rail-btn{width:38px;height:38px;box-shadow:none}
  .rail-btn svg{width:17px;height:17px}
  .modal{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92vh;border-radius:24px 24px 0 0;transform:translateY(100%);opacity:1;padding:26px 20px calc(24px + env(safe-area-inset-bottom))}
  .modal.show{transform:none}
  .manifesto,.manifesto-edit{font-size:30px;letter-spacing:-.03em}
  .panel{padding:22px 16px;border-radius:24px}
  .panel-head{margin:0 0 18px 2px}
  .float{padding:22px 18px;--pad:18px}
  .layout{gap:16px}
  .week td.cnt,.week th.cnt-h{display:none}
  .week-label{display:none}
  .week-nav .round{width:30px;height:30px}
  .t-name{max-width:96px;font-size:14px}
  .t-reg{display:none}
  .cell{width:28px;height:28px}
  .cubes-grid,.projects{grid-template-columns:minmax(0,1fr);gap:14px;margin-top:20px}
  .projects{margin-top:0}
  .intent{font-size:20px;margin-bottom:20px}
  .ktask .del{opacity:1}
  .big b{font-size:38px}
  .legend{gap:12px}
}
@media (max-width:400px){
  .cell{width:26px;height:26px;border-radius:7px}
  .t-name{max-width:84px}
}
</style>
</head>
<body>
<div class="page" id="app"><div class="loading">Загрузка…</div></div>
<div class="toast" id="toast"></div>

<script>
// MyLife home — one screen: personal standard, calendars (week grid + cubes),
// "how are you" check-in, progress, month focus, state journal.
// Backend: /mylife/api/{life,trackers,moods,plans,manifesto} in worker.js.
// The old task canvas lives at /mylife/tasks/.

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

const I = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1.5"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M10 12h4"/></svg>',
};

// ── Theme: light = tasks look, dark = APEX look ───────────────────────────────
function applyTheme() {
  let t = null;
  try { t = localStorage.getItem('mylife:theme'); } catch {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0A0A09' : '#FAFAFA';
}
applyTheme();
window.toggleTheme = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('mylife:theme', next); } catch {}
  applyTheme(); renderHero();
};

// ── Dates (Moscow time, same as the worker) ───────────────────────────────────
const TZ = 3;
const todayKey = () => new Date(Date.now() + TZ * 3600e3).toISOString().slice(0, 10);
const addDays = (k, n) => { const d = new Date(k + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => { const x = Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); return x < 0 ? 0 : x + 1; };
const weekday = k => (new Date(k + 'T00:00:00Z').getUTCDay() + 6) % 7; // 0 = Mon
const monthKey = k => k.slice(0, 7);
const endOfMonth = k => { const d = new Date(k.slice(0, 7) + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + 1); d.setUTCDate(0); return d.toISOString().slice(0, 10); };
const shiftMonth = (mk, n) => { const d = new Date(mk + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const WD_LONG = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
const fmtShort = k => `${+k.slice(8)} ${MONTHS[+k.slice(5, 7) - 1]}`;
const fmtLong = k => `${WD_LONG[weekday(k)]}, ${fmtShort(k)}`;
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const hourMSK = () => new Date(Date.now() + TZ * 3600e3).getUTCHours();
const slotNow = () => { const h = hourMSK(); return h < 12 ? 'morning' : h < 18 ? 'day' : 'evening'; };
const SLOT_LABEL = { morning: 'Утро', day: 'День', evening: 'Вечер' };
const NEXT_SLOT = { morning: '13:00', day: '21:00', evening: '7:00' };

// ── Tracker math (mirrors lifeTrackerTarget/lifeTrackerDone in worker.js) ─────
function trackerTarget(t, until = t.endDate) {
  const end = until < t.endDate ? until : t.endDate;
  const days = daysBetween(t.startDate, end);
  if (!days) return 0;
  if (t.mode === 'daily') return days;
  if (t.mode === 'weekdays') { let n = 0; for (let i = 0; i < days; i++) if (t.days.includes(weekday(addDays(t.startDate, i)))) n++; return n; }
  if (t.mode === 'weekly') return Math.round(days * t.perWeek / 7);
  return Math.round(t.target * days / daysBetween(t.startDate, t.endDate));
}
function trackerDone(t, until = t.endDate, from = '0000') {
  let n = 0;
  for (const [d, c] of Object.entries(t.log || {})) if (d >= t.startDate && d <= t.endDate && d <= until && d >= from) n += c;
  return n;
}
const targetBetween = (t, a, b) => Math.max(0, trackerTarget(t, b) - trackerTarget(t, addDays(a, -1)));
const isScheduled = (t, k) => t.mode !== 'weekdays' || t.days.includes(weekday(k));
const perDay = t => t.mode === 'daily' || t.mode === 'weekdays';
function trackerStats(t) {
  const today = todayKey(), yesterday = addDays(today, -1);
  const total = trackerTarget(t), done = trackerDone(t);
  const active = t.startDate <= today && t.endDate >= today;
  const debt = Math.max(0, trackerTarget(t, yesterday) - trackerDone(t, yesterday));
  const todayCount = (t.log || {})[today] || 0;
  const daysLeft = active ? daysBetween(today, t.endDate) : 0;
  let streak = 0;
  if (perDay(t)) {
    let d = todayCount ? today : yesterday;
    while (d >= t.startDate) {
      if (isScheduled(t, d)) { if ((t.log || {})[d]) streak++; else break; }
      d = addDays(d, -1);
    }
  }
  return { total, done, active, debt, todayCount, daysLeft, streak, upcoming: t.startDate > today, ended: t.endDate < today, pct: total ? Math.min(100, Math.round(done / total * 100)) : 0 };
}
function regularityText(t) {
  if (t.mode === 'daily') return 'Каждый день';
  if (t.mode === 'weekdays') return t.days.length === 5 && t.days.every((d, i) => d === i) ? 'По будням' : t.days.map(d => WD[d]).join(' · ');
  if (t.mode === 'weekly') return `${t.perWeek} ${plural(t.perWeek, 'раз', 'раза', 'раз')} в неделю`;
  return `${t.target} за период`;
}

// ── State ─────────────────────────────────────────────────────────────────────
const S = { life: null, weekOffset: 0, month: monthKey(todayKey()), ci: null, editingManifesto: false, journalAll: false, forceCheckin: false };
const qs = new URLSearchParams(location.search);
if (qs.get('checkin')) { S.forceCheckin = true; history.replaceState(null, '', location.pathname); }

async function api(path, method = 'GET', body) {
  const r = await fetch('/mylife/api/' + path, {
    method, headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store',
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
const fail = e => { console.error(e); toast('Не сохранилось — проверь интернет'); };

async function load() {
  try {
    const life = await api('life');
    life.plans = life.plans || {}; life.trackers = life.trackers || []; life.moods = life.moods || [];
    S.life = life;
  } catch (e) {
    $('#app').innerHTML = `<div class="loading">Не удалось загрузить данные<br><br><button class="pill-btn solid" onclick="load()">Повторить</button></div>`;
    return;
  }
  resumeCheckin();
  renderAll();
  if (S.forceCheckin) { S.forceCheckin = false; $('#ci')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

// ── Skeleton ──────────────────────────────────────────────────────────────────
function renderAll() {
  $('#app').innerHTML = `
    <header class="hero" id="hero"></header>
    <div class="layout">
      <div class="col">
        <section class="panel" id="cal"></section>
        <section class="panel" id="focus"></section>
      </div>
      <aside class="side"><div class="side-wrap col">
        <div class="float" id="ci"></div>
        <div class="float" id="journal"></div>
      </div></aside>
    </div>`;
  renderHero(); renderCal(); renderFocus(); renderCheckin(); renderJournal();
}
const liveTrackers = () => S.life.trackers.filter(t => !t.archived).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
function activeDaySet() {
  const set = new Set();
  for (const t of S.life.trackers) for (const [d, c] of Object.entries(t.log || {})) if (c) set.add(d);
  for (const m of S.life.moods) set.add(m.dateKey);
  return set;
}
function dayStreak() {
  const set = activeDaySet();
  let d = todayKey(); if (!set.has(d)) d = addDays(d, -1);
  let n = 0; while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}

// ══ Hero: date, streak, personal standard ═════════════════════════════════════
const DEFAULT_MANIFESTO = 'Делаю максимум каждый день. Последовательность важнее настроения.';
function renderHero() {
  const el = $('#hero'); if (!el) return;
  const m = S.life.manifesto ?? DEFAULT_MANIFESTO;
  const dark = document.documentElement.dataset.theme === 'dark';
  const pushOff = pushSupported() && Notification.permission !== 'granted';
  const archived = S.life.trackers.filter(t => t.archived).length;
  let body;
  if (S.editingManifesto) {
    body = `<textarea class="manifesto-edit" id="mf" rows="1" placeholder="Мой стандарт на каждый день…">${esc(m)}</textarea>
      <div class="hint">Enter — сохранить · Esc — отмена</div>`;
  } else if (!m.trim()) {
    body = `<div class="manifesto" onclick="editManifesto()"><span class="rest">Напиши свой стандарт на каждый день</span></div>`;
  } else {
    // First sentence bright, the rest muted (gold in the dark theme).
    const i = m.search(/[.!?…](\s|$)/);
    const head = i >= 0 ? m.slice(0, i + 1) : m;
    const rest = i >= 0 ? m.slice(i + 1) : '';
    body = `<div class="manifesto" onclick="editManifesto()" title="Нажми, чтобы изменить">${esc(head)}${rest ? `<span class="rest">${esc(rest)}</span>` : ''}</div>`;
  }
  el.innerHTML = `
    <div class="hero-main">
      ${body}
    </div>
    <div class="rail">
      ${pushSupported() ? `<button class="rail-btn" onclick="enablePush()" title="${pushOff ? 'Включить уведомления' : 'Уведомления включены'}">${I.bell}${pushOff ? '<i class="badge"></i>' : ''}</button>` : ''}
      ${archived ? `<button class="rail-btn" onclick="openArchive()" title="Архив календариков">${I.archive}</button>` : ''}
      <button class="rail-btn" onclick="toggleTheme()" title="Тема">${dark ? I.sun : I.moon}</button>
      <a class="rail-btn" href="/mylife/tasks/" title="Доска задач">${I.board}</a>
    </div>`;
  const ta = $('#mf');
  if (ta) {
    autosize(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.addEventListener('input', () => autosize(ta));
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveManifesto(ta.value); }
      if (e.key === 'Escape') { S.editingManifesto = false; renderHero(); }
    });
    ta.addEventListener('blur', () => S.editingManifesto && saveManifesto(ta.value));
  }
}
window.editManifesto = () => { S.editingManifesto = true; renderHero(); };
async function saveManifesto(v) {
  S.editingManifesto = false;
  const text = v.trim();
  const changed = text !== (S.life.manifesto ?? DEFAULT_MANIFESTO);
  S.life.manifesto = text; renderHero();
  if (changed) try { await api('manifesto', 'PUT', { text }); } catch (e) { fail(e); }
}

// ══ Calendars: week grid + cube cards ═════════════════════════════════════════
function cubeSize(n) { return n <= 31 ? [16, 5] : n <= 70 ? [13, 4] : n <= 140 ? [11, 3] : n <= 250 ? [9, 3] : [7, 2]; }
function cubesHtml(t, st) {
  const [c, g] = cubeSize(st.total);
  const today = todayKey();
  const filled = Math.min(st.done, st.total);
  const debt = perDay(t) ? Math.min(st.debt, st.total - filled) : 0;
  const pending = st.active && !st.todayCount && isScheduled(t, today) && t.mode !== 'total' && filled + debt < st.total;
  let h = '';
  for (let i = 0; i < st.total; i++) {
    const cls = i < filled ? 'f' : i < filled + debt ? 'x' : pending && i === filled + debt ? 't' : '';
    h += `<i class="cube ${cls}"></i>`;
  }
  for (let i = 0; i < Math.min(st.done - st.total, 60); i++) h += '<i class="cube plus"></i>';
  return `<div class="cubes" style="--c:${c}px;--g:${g}px">${h}</div>`;
}
function renderCal() {
  const el = $('#cal'); if (!el) return;
  const trackers = liveTrackers();
  const head = `<div class="panel-head"><h2 class="panel-title">Календарики</h2><span class="grow"></span>
    <button class="round solid" onclick="openTrackerEditor()" title="Новый календарик">${I.plus}</button></div>`;
  if (!trackers.length) {
    el.innerHTML = head + `<div class="empty">
      <div class="demo-cubes">${'<i class="f"></i>'.repeat(5)}${'<i></i>'.repeat(9)}</div>
      <p>Задай цель на период — тренировки, немецкий, продажи. Каждое действие заполняет кубик. Нажми «+».</p>
    </div>`;
    return;
  }
  el.innerHTML = head + `<div class="cubes-grid">${trackers.map(t => {
    const st = trackerStats(t);
    return `<button class="card tcard" onclick="openTracker('${t.id}')">
      <div class="tcard-name">${esc(t.name)}${st.todayCount ? `<span class="today-ok" title="Сегодня отмечено">${I.check}</span>` : ''}</div>
      ${t.why ? `<div class="why">${esc(t.why)}</div>` : ''}
      ${cubesHtml(t, st)}
    </button>`;
  }).join('')}</div>`;
}
window.tapCell = (id, d, delta) => {
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  if (t.mode === 'total' && delta === undefined) delta = 1;
  setMark(t, d, delta);
};
async function setMark(t, date, delta) {
  t.log = t.log || {};
  const cur = t.log[date] || 0;
  const v = delta === undefined ? (cur ? 0 : 1) : Math.max(0, Math.min(99, cur + delta));
  if (v === cur) return;
  if (v) t.log[date] = v; else delete t.log[date];
  if (v > cur) {
    navigator.vibrate?.(12);
    const st = trackerStats(t);
    if (st.done === st.total) toast(`${t.name}: цель выполнена`);
  }
  renderCal(); renderHero(); refreshTrackerModal(t);

// ══ Check-in: score → why → what to do → "иду улучшать" ═══════════════════════

const scoreWord = s => s >= 9 ? 'На максимуме' : s >= 7 ? 'Хорошо' : s >= 5 ? 'Нормально' : s >= 3 ? 'Так себе' : 'Тяжело';
function renderCheckin() {

      <textarea class="ta" id="ci-in" placeholder="${why ? 'Сон, люди, работа, тело, мысли…' : 'Одно конкретное действие: прогулка 15 минут, тренировка, звонок…'}">${esc(why ? ci.why : ci.action)}</textarea>

window.startCheckin = () => { S.ci = { step: 0 }; renderCheckin(); };
// ── Score wheel ───────────────────────────────────────────────────────────────
function initWheel(start) {
  const track = $('#wheel'); if (!track) return;
  const items = [...track.children];
  const pos = el => el.offsetLeft + el.offsetWidth / 2;
  const goTo = (i, smooth = true) => track.scrollTo({ left: pos(items[i]) - track.clientWidth / 2, behavior: smooth ? 'smooth' : 'auto' });
  let cur = -1;
  const update = () => {
    const c = track.scrollLeft + track.clientWidth / 2, step = pos(items[1]) - pos(items[0]);
    let best = 0, bd = Infinity;
    items.forEach((el, i) => {
      const d = (pos(el) - c) / step, a = Math.min(Math.abs(d), 3);
      if (Math.abs(d) < bd) { bd = Math.abs(d); best = i; }
      el.style.transform = `scale(${1 - a * .2})`; el.style.opacity = String(1 - a * .3);
    });
    if (best !== cur) { if (cur !== -1) try { navigator.vibrate?.(4); } catch {} cur = best; S.wheel = cur; }
  };
  track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  // Mouse drag with the left button held; snap is paused while dragging.
  let drag = null, dragged = false;
  track.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { x: e.clientX, s: track.scrollLeft }; dragged = false; track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', e => {
    if (!drag) return;
    const d = e.clientX - drag.x;
    if (!dragged && Math.abs(d) > 4) { dragged = true; track.style.scrollSnapType = 'none'; track.style.cursor = 'grabbing'; }
    if (dragged) track.scrollLeft = drag.s - d;
  });
  const endDrag = () => { if (!drag) return; drag = null; track.style.cursor = ''; if (dragged) { update(); track.style.scrollSnapType = ''; goTo(cur); } };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  track.addEventListener('click', e => { if (dragged) { dragged = false; return; } const el = e.target.closest('button'); if (el) goTo(items.indexOf(el)); });
  track.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); goTo(Math.max(0, Math.min(10, cur + Math.sign(e.deltaY)))); } }, { passive: false });
  track.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); goTo(Math.max(0, Math.min(10, cur + (e.key === 'ArrowRight' ? 1 : -1)))); }
    if (e.key === 'Enter') pickScore(cur);
  });
  requestAnimationFrame(() => { goTo(start, false); update(); });
}
window.pickScore = score => {
  const ci = S.ci = { step: 1, score, why: '', action: '', focus: true };
  renderCheckin();
  ci.pending = api('moods', 'POST', { score, slot: slotNow() }).then(({ mood }) => {

};
function ciRead() { const ta = $('#ci-in'); if (ta) S.ci[S.ci.step === 1 ? 'why' : 'action'] = ta.value.trim(); }
window.ciBack = () => { ciRead(); S.ci.step = Math.max(0, S.ci.step - 1); S.ci.focus = true; renderCheckin(); };
window.ciNext = async () => {

async function saveCi(patch) {

const planTimers = {}, planDirty = new Set();

// ══ Modal ═════════════════════════════════════════════════════════════════════

  const d = draft, today = todayKey();
  const presets = [['До конца месяца', today, endOfMonth(today)], ['До конца года', today, today.slice(0, 4) + '-12-31'], ['30 дней', today, addDays(today, 29)], ['66 дней', today, addDays(today, 65)], ['90 дней', today, addDays(today, 89)]];
  return `<h3>${d._edit ? 'Календарик' : 'Новый календарик'}</h3>
    <input class="m-name" id="tr-name" placeholder="Что отмечаем: тренировка, немецкий, продажа…" value="${esc(d.name)}" oninput="draft.name=this.value" onkeydown="if(event.key==='Enter')saveTracker()">
    <div class="m-field"><span class="m-label">Регулярность</span>
      <div class="seg">${[['daily', 'Каждый день'], ['weekdays', 'По дням недели'], ['weekly', 'N раз в неделю'], ['total', 'N раз за период']].map(([m, l]) => `<button class="${d.mode === m ? 'on' : ''}" onclick="draft.mode='${m}';rerenderEditor()">${l}</button>`).join('')}</div>
      ${d.mode === 'weekdays' ? `<div class="wd-row">${WD.map((w, i) => `<button class="${d.days.includes(i) ? 'on' : ''}" onclick="toggleDay(${i})">${w}</button>`).join('')}</div>` : ''}
      ${d.mode === 'weekly' ? `<div class="stepper"><button class="round" onclick="draft.perWeek=Math.max(1,draft.perWeek-1);rerenderEditor()">${I.minus}</button><b>${d.perWeek}</b><button class="round" onclick="draft.perWeek=Math.min(7,draft.perWeek+1);rerenderEditor()">${I.plus}</button>${plural(d.perWeek, 'раз', 'раза', 'раз')} в неделю</div>` : ''}
      ${d.mode === 'total' ? `<div class="stepper"><input class="inline-in" type="number" min="1" max="5000" style="width:96px;flex:none" value="${d.target}" oninput="draft.target=Math.max(1,parseInt(this.value)||1);updatePreview()">раз за весь период, можно отмечать несколько раз в день</div>` : ''}
    </div>
    <div class="m-field"><span class="m-label">Период</span>
      <div class="seg">${presets.map(([l, a, b]) => `<button class="${d.startDate === a && d.endDate === b ? 'on' : ''}" onclick="draft.startDate='${a}';draft.endDate='${b}';rerenderEditor()">${l}</button>`).join('')}</div>
      <div class="dates"><label>Начало<input class="inline-in" type="date" value="${d.startDate}" onchange="draft.startDate=this.value;rerenderEditor()"></label><label>Конец<input class="inline-in" type="date" value="${d.endDate}" onchange="draft.endDate=this.value;rerenderEditor()"></label></div>
    </div>
    <div class="m-field"><span class="m-label">Зачем мне это</span><input class="inline-in" style="width:100%" placeholder="Необязательно: чтобы сдать экзамен в январе" value="${esc(d.why || '')}" oninput="draft.why=this.value"></div>
    <div class="preview" id="tr-preview">${previewHtml()}</div>
    <div class="m-actions"><button class="btn ghost" onclick="${d._edit ? `openTracker('${d.id}')` : 'closeModal()'}">Отмена</button><button class="btn primary" onclick="saveTracker()">${d._edit ? 'Сохранить' : 'Создать'}</button></div>
    ${d._edit ? `<div class="m-danger"><button class="pill-btn" onclick="archiveTracker('${d.id}')">В архив</button><button class="pill-btn danger" onclick="deleteTracker('${d.id}')">Удалить</button></div>` : ''}`;
}
function previewHtml() {
  const d = draft;
  if (!d.startDate || !d.endDate || d.endDate < d.startDate) return `<span class="muted" style="font-size:14px">Проверь даты периода</span>`;
  const total = trackerTarget(d), [c, g] = cubeSize(total);
  const shown = Math.min(total, 500);
  const done = d._edit ? Math.min(trackerDone(d), shown) : 0;
  return `<div class="preview-top"><b>${total} ${plural(total, 'кубик', 'кубика', 'кубиков')}</b><span class="muted">${fmtShort(d.startDate)} — ${fmtShort(d.endDate)}</span></div>
    <div class="cubes" style="--c:${c}px;--g:${g}px">${'<i class="cube f"></i>'.repeat(done)}${'<i class="cube"></i>'.repeat(shown - done)}</div>`;
}
window.updatePreview = () => { $('#tr-preview').innerHTML = previewHtml(); };
window.rerenderEditor = () => setModal(editorHtml());
window.toggleDay = i => { draft.days = draft.days.includes(i) ? draft.days.filter(x => x !== i) : [...draft.days, i].sort(); rerenderEditor(); };
window.saveTracker = async () => {
  const d = draft;
  if (!d.name.trim()) { $('#tr-name').focus(); toast('Назови календарик'); return; }
  if (!d.startDate || !d.endDate || d.endDate < d.startDate) { toast('Конец периода раньше начала'); return; }
  if (d.mode === 'weekdays' && !d.days.length) { toast('Выбери хотя бы один день'); return; }
  const body = { name: d.name.trim(), why: d.why || '', mode: d.mode, days: d.days, perWeek: d.perWeek, target: d.target, startDate: d.startDate, endDate: d.endDate };
  closeModal();
  try {
    if (d._edit) {
      const { tracker } = await api('trackers/' + d.id, 'PATCH', body);
      S.life.trackers[S.life.trackers.findIndex(t => t.id === d.id)] = tracker;
      renderCal(); openTracker(d.id); return;
    } else {
      const { tracker } = await api('trackers', 'POST', body);
      S.life.trackers.push(tracker);
      const n = trackerTarget(tracker);
      toast(`Создано ${n} ${plural(n, 'кубик', 'кубика', 'кубиков')}`);
    }
    renderCal();
  } catch (e) { fail(e); }
};
window.archiveTracker = async id => {
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  t.archived = true; closeModal(); renderCal(); renderHero(); toast('Убрано в архив');
  try { await api('trackers/' + id, 'PATCH', { archived: true }); } catch (e) { fail(e); }
};
window.deleteTracker = async id => {
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  if (!confirm(`Удалить «${t.name}» вместе со всеми отметками?`)) return;
  S.life.trackers = S.life.trackers.filter(x => x.id !== id); closeModal(); renderCal(); renderHero();
  try { await api('trackers/' + id, 'DELETE'); } catch (e) { fail(e); }
};
window.openArchive = () => {
  const list = S.life.trackers.filter(t => t.archived);
  openModal(`<h3>Архив</h3>${list.map(t => `<div class="list-row"><div class="grow"><div style="font-weight:500">${esc(t.name)}</div><div class="muted" style="font-size:13px;margin-top:2px">${trackerDone(t)} из ${trackerTarget(t)} · ${fmtShort(t.startDate)} — ${fmtShort(t.endDate)}</div></div><button class="pill-btn" onclick="restoreTracker('${t.id}')">Вернуть</button></div>`).join('') || '<p class="muted">Пусто</p>'}
    <div class="m-actions" style="margin-top:18px"><button class="btn primary" onclick="closeModal()">Готово</button></div>`);
};
window.restoreTracker = async id => {
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  t.archived = false; renderCal(); renderHero();
  S.life.trackers.some(x => x.archived) ? openArchive() : closeModal();
  try { await api('trackers/' + id, 'PATCH', { archived: false }); } catch (e) { fail(e); }
};

// ══ Push notifications ════════════════════════════════════════════════════════
function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function b64ToBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function subscribePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const kr = await fetch('/mylife/api/push/vapid-key'); if (!kr.ok) return false;
    const { key } = await kr.json(); if (!key) return false;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    await fetch('/mylife/api/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subscription: sub.toJSON() }) });
    return true;
  } catch (e) { console.warn('push', e); return false; }
}
window.enablePush = async () => {
  if (Notification.permission === 'granted') { toast('Уведомления включены: 7:00, 13:00, 21:00'); return; }
  if (Notification.permission === 'denied') { toast('Уведомления заблокированы — разреши их в настройках сайта'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') toast(await subscribePush() ? 'Готово: спрошу, как ты, в 7:00, 13:00 и 21:00' : 'Не получилось подписаться на уведомления');
  renderHero();
};
if (pushSupported()) navigator.serviceWorker.register('/mylife/sw.js').then(() => { if (Notification.permission === 'granted') subscribePush(); }).catch(() => {});

// Day rolled over while the page was open → re-render so "today" moves.
let lastDay = todayKey();
setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); S.ci = null; S.weekOffset = 0; renderAll(); } }, 60e3);

load();
</script>
</body>
</html>
