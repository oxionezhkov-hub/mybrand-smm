<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyLife</title>
<meta name="theme-color" content="#F5F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --card-2:#FAF8F4; --text:#1B1A17; --muted:#8B877E; --faint:#BDB8AD;
  --line:rgba(27,26,23,.08); --line-2:rgba(27,26,23,.14);
  --accent:#2F7D5B; --accent-soft:rgba(47,125,91,.12); --warn:#C9772B; --warn-soft:rgba(201,119,43,.13);
  --bad:#C2453D; --empty:#ECE8E0; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.04);
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121210; --card:#1C1C19; --card-2:#22221F; --text:#F2F0EA; --muted:#9A968C; --faint:#5F5C55;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
    --accent:#5CC08E; --accent-soft:rgba(92,192,142,.14); --warn:#E39A52; --warn-soft:rgba(227,154,82,.15);
    --bad:#E36B62; --empty:#2A2A26; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121210; --card:#1C1C19; --card-2:#22221F; --text:#F2F0EA; --muted:#9A968C; --faint:#5F5C55;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --accent:#5CC08E; --accent-soft:rgba(92,192,142,.14); --warn:#E39A52; --warn-soft:rgba(227,154,82,.15);
  --bad:#E36B62; --empty:#2A2A26; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{padding:calc(18px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:flex-start;gap:12px}
header.top .h-main{flex:1;min-width:0}
.date{font-size:13px;color:var(--muted);font-weight:500}
.date::first-letter{text-transform:uppercase}
h1{font-size:28px;line-height:1.15;margin:4px 0 0;font-weight:800;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.pill{font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.pill .n{font-variant-numeric:tabular-nums}
section{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.sec-h .link{font-size:13px;color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;background:var(--card-2);border:1px solid var(--line-2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:11px}

/* Manifesto */
.manifesto{position:relative;padding:16px 18px;border-radius:var(--r);background:var(--text);color:var(--bg);font-weight:600;font-size:16px;line-height:1.4;cursor:pointer}
.manifesto .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;font-weight:700;margin-bottom:6px}
.manifesto.empty{background:var(--card);color:var(--muted);border:1px dashed var(--line-2)}

/* Check-in */
.ci-q{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.ci-sub{font-size:14px;color:var(--muted);margin:0 0 14px}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.scale button{aspect-ratio:1/1.15;border-radius:11px;font-weight:700;font-size:15px;background:var(--card-2);border:1px solid var(--line);transition:transform .15s var(--ease)}
.scale button:active{transform:scale(.92)}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
textarea.ta{width:100%;min-height:92px;border-radius:14px;border:1px solid var(--line-2);background:var(--card-2);padding:12px 14px;font-size:16px;line-height:1.4;resize:vertical;outline:none}
textarea.ta:focus,input.in:focus{border-color:var(--accent)}
.ci-actions{display:flex;gap:8px;margin-top:12px}
.ci-actions .btn{flex:1}
.ci-score-big{display:inline-grid;place-items:center;min-width:46px;height:46px;border-radius:14px;font-size:20px;font-weight:800;color:#fff;margin-right:12px;padding:0 8px}
.ci-head{display:flex;align-items:center;margin-bottom:14px}
.commit{margin-top:6px;padding:14px;border-radius:14px;background:var(--accent-soft);font-weight:600;line-height:1.4}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.slot{border-radius:14px;padding:10px;background:var(--card-2);border:1px solid var(--line);text-align:center}
.slot .s-l{font-size:12px;color:var(--muted);font-weight:600}
.slot .s-v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.slot.cur{border-color:var(--line-2)}
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--empty)}
.steps i.on{background:var(--accent)}

/* Trackers */
.tr-head{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.tr-emoji{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none}
.tr-title{flex:1;min-width:0}
.tr-name{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.tr-meta{font-size:13px;color:var(--muted);margin-top:3px}
.tr-count{text-align:right;flex:none}
.tr-count b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.tr-count span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.cubes{display:flex;flex-wrap:wrap;gap:var(--g,4px);margin:14px 0 12px}
.cube{width:var(--c,16px);height:var(--c,16px);border-radius:calc(var(--c,16px)/4);background:var(--empty)}
.cube.f{background:var(--tc)}
.cube.debt{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn);opacity:.75}
.cube.today{background:transparent;box-shadow:inset 0 0 0 2px var(--tc);animation:pulse 1.8s ease-in-out infinite}
.cube.extra{background:var(--tc);opacity:.45}
@keyframes pulse{50%{opacity:.35}}
.tr-foot{display:flex;align-items:center;gap:10px}
.pace{flex:1;font-size:13px;font-weight:600}
.pace.ok{color:var(--accent)} .pace.warn{color:var(--warn)} .pace.done{color:var(--accent)}
.mark{height:42px;padding:0 16px;border-radius:13px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--tc);color:var(--tc);background:transparent;transition:transform .15s var(--ease)}
.mark:active{transform:scale(.95)}
.mark.on{background:var(--tc);color:#fff}
.counter{display:inline-flex;align-items:center;gap:6px}
.counter .mini{width:42px;height:42px;border-radius:13px;border:1px solid var(--line-2);font-size:20px;font-weight:700}
.tr-why{font-size:13px;color:var(--muted);font-style:italic;margin-top:10px}
.add-card{width:100%;border:1.5px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--muted);font-weight:600;display:flex;justify-content:center;gap:8px;margin-top:12px;background:transparent}

/* Month focus (today) */
.intent{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.proj{padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}
.proj:first-child{border-top:0;margin-top:0;padding-top:0}
.proj-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.proj-focus{font-size:14px;margin:4px 0 0 18px;color:var(--muted)}
.ktasks{list-style:none;margin:8px 0 0;padding:0}
.ktask{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
.chk{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line-2);flex:none;display:grid;place-items:center;margin-top:1px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:'';width:10px;height:6px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ktask .t{flex:1;font-size:15px;line-height:1.35}
.ktask.done .t{color:var(--muted);text-decoration:line-through}
.empty-state{text-align:center;padding:26px 18px}
.empty-state p{margin:6px 0 14px;color:var(--muted);font-size:14px;line-height:1.45}

/* Month editor */
.month-bar{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.month-bar h1{font-size:24px;text-transform:capitalize}
.in{width:100%;height:44px;border-radius:13px;border:1px solid var(--line-2);background:var(--card-2);padding:0 13px;font-size:16px;outline:none}
.in.plain{border-color:transparent;background:transparent;padding:0;height:auto;font-weight:700;font-size:18px}
.field{margin-top:14px}
.field label,.lbl2{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.edit-task{display:flex;gap:8px;align-items:center;padding:4px 0}
.edit-task input{flex:1;border:0;background:transparent;font-size:15px;padding:6px 0;outline:none;border-bottom:1px solid transparent}
.edit-task input:focus{border-bottom-color:var(--line-2)}
.edit-task.done input{color:var(--muted);text-decoration:line-through}
.x{width:30px;height:30px;border-radius:9px;color:var(--faint);font-size:18px;flex:none}
.x:hover{color:var(--bad)}
.saved{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;min-height:16px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.colors button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}

/* Summary */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.chart{width:100%;height:150px;display:block}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px}
.bars .b{flex:1;border-radius:4px 4px 2px 2px;min-height:3px;background:var(--empty);position:relative}
.bars-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.prog{height:8px;border-radius:8px;background:var(--empty);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:8px}
.row{display:flex;align-items:center;gap:10px}
.journal-day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px}
.jentry{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.jentry:first-of-type{border-top:0}
.jscore{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.jtext{font-size:14px;line-height:1.45}
.jtext .a{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.insight{font-size:14px;line-height:1.45;padding:8px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in-tabs{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--text)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s var(--ease)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 12px}
.sheet .inner{max-width:640px;margin:0 auto}
.sheet h3{font-size:22px;font-weight:800;margin:4px 0 12px;letter-spacing:-.01em}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:50%;width:640px;border-radius:24px;transform:translate(-50%,60%);opacity:0;transition:transform .25s var(--ease),opacity .2s}
  .sheet.show{transform:translate(-50%,50%);opacity:1}
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);font-size:14px;font-weight:600}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.emojis button.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);font-size:18px;font-weight:700}
.stepper b{min-width:26px;text-align:center;font-size:18px}
.preview{margin-top:14px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal button{aspect-ratio:1;border-radius:9px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);position:relative}
.cal button.f{background:var(--tc);color:#fff;border-color:transparent}
.cal button.off{opacity:.3}
.cal button.out{visibility:hidden}
.cal button.nosched{color:var(--faint)}
.cal button.td{box-shadow:inset 0 0 0 2px var(--tc)}
.cal button .cnt{position:absolute;top:1px;right:4px;font-size:9px}
.cal-month{font-weight:700;margin:14px 0 2px;text-transform:capitalize}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .grow{flex:1;min-width:0}
.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s var(--ease);z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--warn-soft);font-size:14px;line-height:1.4;margin-top:12px}
.banner .grow{flex:1}
@media (max-width:380px){ .scale{gap:3px} .scale button{font-size:13px;border-radius:9px} h1{font-size:25px} }
</style>
</head>
<body>
<div id="view" class="wrap"><div class="loading">Загрузка…</div></div>

<nav class="tabs"><div class="in-tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сегодня</button>
  <button data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>Месяц</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Итоги</button>
</div></nav>

<div class="toast" id="toast"></div>

<script>
// MyLife home: calendars (cube trackers), state check-ins, month focus.
// Backend: /mylife/api/{life,trackers,moods,plans,manifesto} in worker.js.
// The old task canvas lives at /mylife/tasks/.

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

// ── Dates (Moscow time, same as the worker) ───────────────────────────────────
const TZ = 3;
const todayKey = () => new Date(Date.now() + TZ * 3600e3).toISOString().slice(0, 10);
const addDays = (k, n) => { const d = new Date(k + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => { const x = Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); return x < 0 ? 0 : x + 1; };
const weekday = k => (new Date(k + 'T00:00:00Z').getUTCDay() + 6) % 7; // 0 = Mon
const monthKey = k => k.slice(0, 7);
const endOfMonth = k => { const d = new Date(k.slice(0, 7) + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + 1); d.setUTCDate(0); return d.toISOString().slice(0, 10); };
const shiftMonth = (mk, n) => { const d = new Date(mk + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_SHORT = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_LONG = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const fmtShort = k => `${+k.slice(8)} ${MONTHS_SHORT[+k.slice(5, 7) - 1]}`;
const fmtLong = k => `${WD_LONG[weekday(k)]}, ${+k.slice(8)} ${MONTHS[+k.slice(5, 7) - 1]}`;
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const slotNow = () => { const h = new Date(Date.now() + TZ * 3600e3).getUTCHours(); return h < 12 ? 'morning' : h < 18 ? 'day' : 'evening'; };
const SLOT_LABEL = { morning: 'Утро', day: 'День', evening: 'Вечер' };

// ── Tracker math (mirrors lifeTrackerTarget/lifeTrackerDone in worker.js) ─────
function trackerTarget(t, until = t.endDate) {
  const end = until < t.endDate ? until : t.endDate;
  const days = daysBetween(t.startDate, end);
  if (!days) return 0;
  if (t.mode === 'daily') return days;
  if (t.mode === 'weekdays') { let n = 0; for (let i = 0; i < days; i++) if (t.days.includes(weekday(addDays(t.startDate, i)))) n++; return n; }
  if (t.mode === 'weekly') return Math.round(days * t.perWeek / 7);
  return Math.round(t.target * days / daysBetween(t.startDate, t.endDate));
}
function trackerDone(t, until = t.endDate) {
  let n = 0;
  for (const [d, c] of Object.entries(t.log || {})) if (d >= t.startDate && d <= t.endDate && d <= until) n += c;
  return n;
}
const isScheduled = (t, k) => t.mode !== 'weekdays' || t.days.includes(weekday(k));
function trackerStats(t) {
  const today = todayKey();
  const total = trackerTarget(t);
  const done = trackerDone(t);
  const active = t.startDate <= today && t.endDate >= today;
  const ended = t.endDate < today;
  const yesterday = addDays(today, -1);
  const expectedY = trackerTarget(t, yesterday);
  const doneY = trackerDone(t, yesterday);
  const debt = Math.max(0, expectedY - doneY);
  const todayCount = (t.log || {})[today] || 0;
  const daysLeft = active ? daysBetween(today, t.endDate) : 0;
  // streak: consecutive scheduled days done (daily/weekdays), ending today or yesterday
  let streak = 0;
  if (t.mode === 'daily' || t.mode === 'weekdays') {
    let d = todayCount ? today : yesterday;
    while (d >= t.startDate) {
      if (isScheduled(t, d)) { if ((t.log || {})[d]) streak++; else break; }
      d = addDays(d, -1);
    }
  }
  return { total, done, active, ended, debt, todayCount, daysLeft, streak, pct: total ? Math.min(100, Math.round(done / total * 100)) : 0 };
}
function regularityText(t) {
  if (t.mode === 'daily') return 'каждый день';
  if (t.mode === 'weekdays') return t.days.length === 5 && t.days.every((d, i) => d === i) ? 'по будням' : t.days.map(d => WD[d]).join(', ');
  if (t.mode === 'weekly') return `${t.perWeek} ${plural(t.perWeek, 'раз', 'раза', 'раз')} в неделю`;
  return `${t.target} за период`;
}

function scoreColor(s) {
  if (s == null) return 'var(--faint)';
  if (s <= 3) return '#C2453D';
  if (s <= 5) return '#D9822B';
  if (s <= 7) return '#C9A227';
  return '#2F9E6A';
}

async function api(path, method = 'GET', body) {
  const r = await fetch('/mylife/api/' + path, {
    method, headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store',
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

}

// ── Consistency: days with any mark or check-in ───────────────────────────────
function activeDaySet() {
  const set = new Set();
  for (const t of S.life.trackers) for (const [d, c] of Object.entries(t.log || {})) if (c) set.add(d);
  for (const m of S.life.moods) set.add(m.dateKey);
  return set;
}
function dayStreak() {
  const set = activeDaySet();
  let d = todayKey(); if (!set.has(d)) d = addDays(d, -1);
  let n = 0; while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
const liveTrackers = () => S.life.trackers.filter(t => !t.archived).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

// ── Check-in ──────────────────────────────────────────────────────────────────
// Steps: 0 score → 1 why → 2 what to do → 3 commit ("иду улучшать") → done
function resumeCheckin() {
  const today = todayKey();
  const open = S.life.moods
    .filter(m => m.dateKey === today && !m.committedAt && Date.now() - m.createdAt < 3 * 3600e3)
    .sort((a, b) => b.createdAt - a.createdAt)[0];
  if (open && !S.forceCheckin) {
    S.ci = { moodId: open.id, score: open.score, why: open.why || '', action: open.action || '',
      step: !open.why ? 1 : !open.action ? 2 : 3 };
  } else if (S.forceCheckin) {
    S.ci = { step: 0 };
  }
}
function renderCheckin() {
  const today = todayKey();
  const todays = S.life.moods.filter(m => m.dateKey === today);
  const slot = slotNow();
  const slotsHtml = `<div class="slots">${['morning', 'day', 'evening'].map(s => {
    const list = todays.filter(m => m.slot === s);
    const last = list[list.length - 1];
    return `<div class="slot ${s === slot ? 'cur' : ''}"><div class="s-l">${SLOT_LABEL[s]}</div><div class="s-v" style="color:${last ? scoreColor(last.score) : 'var(--faint)'}">${last ? last.score : '—'}</div></div>`;
  }).join('')}</div>`;

  const ci = S.ci;
  const hasSlot = todays.some(m => m.slot === slot);
  if (!ci && hasSlot) {
    const last = todays.filter(m => m.slot === slot).pop();
    return `<div class="card">
      <div class="ci-head"><span class="ci-score-big" style="background:${scoreColor(last.score)}">${last.score}</span>
        <div><div style="font-weight:700">${SLOT_LABEL[slot]} отмечено</div><div class="small muted">${last.committedAt ? '✊ Ты взял ответственность за своё состояние' : 'Следующий вопрос — в ' + (slot === 'morning' ? '13:00' : slot === 'day' ? '21:00' : '7:00')}</div></div></div>
      ${last.action ? `<div class="commit">Мой шаг: ${esc(last.action)}</div>` : ''}
      ${slotsHtml}
      <div class="ci-actions"><button class="btn ghost" onclick="startCheckin()">Отметить ещё раз</button></div>
    </div>`;
  }
  if (!ci || ci.step === 0) {
    return `<div class="card">
      <p class="ci-q">Как ты себя ощущаешь?</p>
      <p class="ci-sub">Честно, по шкале от 0 до 10</p>
      <div class="scale">${Array.from({ length: 11 }, (_, i) => `<button onclick="pickScore(${i})" style="color:${scoreColor(i)}">${i}</button>`).join('')}</div>
      <div class="scale-legend"><span>совсем плохо</span><span>на максимуме</span></div>
      ${slotsHtml}
    </div>`;
  }
  const head = `<div class="steps">${[1, 2, 3].map(i => `<i class="${ci.step >= i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="ci-head"><span class="ci-score-big" style="background:${scoreColor(ci.score)}">${ci.score}</span><div class="small muted">${SLOT_LABEL[slotNow()]} · ${ci.score >= 8 ? 'отличное состояние' : ci.score >= 6 ? 'нормально' : ci.score >= 4 ? 'так себе' : 'тяжело'}</div></div>`;
  if (ci.step === 1) {
    return `<div class="card">${head}
      <p class="ci-q">Почему я себя так ощущаю?</p>
      <textarea class="ta" id="ci-why" placeholder="Сон, люди, работа, тело, мысли…">${esc(ci.why)}</textarea>
      <div class="ci-actions"><button class="btn" onclick="ciBack()">Назад</button><button class="btn primary" onclick="ciNext('why')">Дальше</button></div>
    </div>`;
  }
  if (ci.step === 2) {
    return `<div class="card">${head}
      <p class="ci-q">${ci.score >= 8 ? 'Что сделать, чтобы удержать это состояние?' : 'Что я должен сделать, чтобы улучшить своё состояние?'}</p>
      <textarea class="ta" id="ci-action" placeholder="Одно конкретное действие прямо сейчас: прогулка 15 минут, вода, звонок, тренировка…">${esc(ci.action)}</textarea>
      <div class="ci-actions"><button class="btn" onclick="ciBack()">Назад</button><button class="btn primary" onclick="ciNext('action')">Дальше</button></div>
    </div>`;
  }
  return `<div class="card">${head}
    ${ci.why ? `<div class="small muted" style="margin-bottom:8px">Почему: ${esc(ci.why)}</div>` : ''}
    <div class="commit">${ci.action ? 'Мой шаг: ' + esc(ci.action) : 'Я отвечаю за своё состояние.'}</div>

      <button class="btn accent block" style="height:52px;font-size:16px" onclick="ciCommit()">✊ Иду улучшать состояние</button>
      <button class="btn ghost" onclick="ciBack()">Назад</button>
    </div>
  </div>`;
}
window.startCheckin = () => { S.ci = { step: 0 }; render(); };
window.pickScore = async score => {
  S.ci = { step: 1, score, why: '', action: '' };
  render();
  $('#ci-why')?.focus({ preventScroll: true });
  const ci = S.ci;
  ci.pending = api('moods', 'POST', { score, slot: slotNow() }).then(({ mood }) => {
    S.life.moods.push(mood); ci.moodId = mood.id;
  }).catch(fail);
  await ci.pending;
};
function ciReadInputs() {
  const w = $('#ci-why'), a = $('#ci-action');
  if (w) S.ci.why = w.value.trim();
  if (a) S.ci.action = a.value.trim();
}
window.ciBack = () => { ciReadInputs(); S.ci.step = Math.max(0, S.ci.step - 1); render(); };
window.ciNext = async field => {
  ciReadInputs();
  S.ci.step++;
  render();
  if (S.ci.step === 2) $('#ci-action')?.focus({ preventScroll: true });
  await saveCi({ [field]: S.ci[field] });
};
async function saveCi(patch) {
  const ci = S.ci; if (!ci) return;
  if (ci.pending) await ci.pending;
  if (!ci.moodId) return;
  try {
    const { mood } = await api('moods/' + ci.moodId, 'PATCH', patch);
    const i = S.life.moods.findIndex(m => m.id === mood.id); if (i >= 0) S.life.moods[i] = mood;
  } catch (e) { fail(e); }
}
window.ciCommit = async () => {
  if (S.ci?.pending) await S.ci.pending;
  const id = S.ci?.moodId;
  S.ci = null;
  if (id) {
    const m = S.life.moods.find(x => x.id === id); if (m) m.committedAt = Date.now();
    render();
    toast('✊ Принято. Действуй.');

};

// ── Tracker cards ─────────────────────────────────────────────────────────────
function cubeSize(n) {
  return n <= 30 ? [20, 5] : n <= 70 ? [16, 4] : n <= 140 ? [13, 3] : n <= 250 ? [10, 3] : [8, 2];
}
function renderCubes(t, st) {
  const [c, g] = cubeSize(st.total);
  const today = todayKey();
  const filled = Math.min(st.done, st.total);
  const todayPending = st.active && !st.todayCount && isScheduled(t, today) && t.mode !== 'total' && filled < st.total;
  let html = '';
  for (let i = 0; i < st.total; i++) {
    let cls = 'cube';
    if (i < filled) cls += ' f';
    else if (i < filled + st.debt) cls += ' debt';
    else if (todayPending && i === filled + st.debt) cls += ' today';
    html += `<i class="${cls}"></i>`;
  }
  for (let i = 0; i < Math.min(st.done - st.total, 60); i++) html += `<i class="cube extra"></i>`;
  return `<div class="cubes" style="--c:${c}px;--g:${g}px">${html}</div>`;
}
function renderTrackerCard(t) {
  const st = trackerStats(t);
  const today = todayKey();
  let pace;
  if (st.done >= st.total && st.total) pace = `<span class="pace done">🏆 Цель выполнена${st.done > st.total ? ` · +${st.done - st.total} сверху` : ''}</span>`;
  else if (t.startDate > today) pace = `<span class="pace muted">Старт ${fmtShort(t.startDate)}</span>`;
  else if (st.ended) pace = `<span class="pace warn">Период закончился · ${st.pct}%</span>`;
  else if (st.debt > 0) pace = `<span class="pace warn">Отстаёшь на ${st.debt} — догоняй</span>`;
  else pace = `<span class="pace ok">В графике${st.streak > 1 ? ` · 🔥 ${st.streak} подряд` : ''}${st.daysLeft ? ` · ещё ${st.daysLeft} ${plural(st.daysLeft, 'день', 'дня', 'дней')}` : ''}</span>`;

  let btn = '';
  if (st.active) {
    if (t.mode === 'total') {
      btn = `<span class="counter">${st.todayCount ? `<button class="mini" onclick="markTracker('${t.id}',-1)" aria-label="Минус">−</button>` : ''}<button class="mark ${st.todayCount ? 'on' : ''}" onclick="markTracker('${t.id}',1)">+1${st.todayCount ? ` · ${st.todayCount}` : ''}</button></span>`;
    } else {
      const sched = isScheduled(t, today);
      btn = st.todayCount
        ? `<button class="mark on" onclick="markTracker('${t.id}')">✓ Сделано</button>`
        : `<button class="mark" onclick="markTracker('${t.id}')">${sched ? 'Сделал сегодня' : 'Сделал (бонус)'}</button>`;
    }
  }
  return `<div class="card" style="--tc:${t.color}">
    <div class="tr-head" onclick="openTracker('${t.id}')">
      <div class="tr-emoji" style="background:${t.color}22">${esc(t.emoji || '◼︎')}</div>
      <div class="tr-title"><div class="tr-name">${esc(t.name)}</div><div class="tr-meta">${esc(regularityText(t))} · ${fmtShort(t.startDate)} – ${fmtShort(t.endDate)}</div></div>
      <div class="tr-count"><b>${st.done}</b><span>из ${st.total}</span></div>
    </div>

async function setMark(t, date, delta) {
  t.log = t.log || {};
  const cur = t.log[date] || 0;
  const v = delta === undefined ? (cur ? 0 : 1) : Math.max(0, cur + delta);
  if (v) t.log[date] = v; else delete t.log[date];
  if (v > cur) {
    navigator.vibrate?.(15);
    const st = trackerStats(t);
    if (st.done === st.total) toast(`🏆 ${t.name}: цель выполнена!`);
    else if (date === todayKey()) toast(`${t.emoji || '✓'} +1 кубик · ${st.done}/${st.total}`);
  }
  render(); refreshTrackerSheet(t);
  try { await api('trackers/' + t.id, 'PATCH', { mark: { date, value: v } }); } catch (e) { fail(e); }
}

function renderStats() {
  const n = S.statsRange;
  const today = todayKey();
  const from = addDays(today, -(n - 1));
  const days = Array.from({ length: n }, (_, i) => addDays(from, i));
  const moods = S.life.moods.filter(m => m.dateKey >= from);
  const avg = moods.length ? moods.reduce((s, m) => s + m.score, 0) / moods.length : null;
  const prevMoods = S.life.moods.filter(m => m.dateKey >= addDays(from, -n) && m.dateKey < from);
  const prevAvg = prevMoods.length ? prevMoods.reduce((s, m) => s + m.score, 0) / prevMoods.length : null;
  const committed = moods.filter(m => m.committedAt).length;
  const set = activeDaySet();
  const activeDays = days.filter(d => set.has(d)).length;
  let cubes = 0;
  for (const t of S.life.trackers) for (const [d, c] of Object.entries(t.log || {})) if (d >= from) cubes += c;
  const mk = monthKey(today);
  const plan = S.life.plans[mk];
  const kt = (plan?.projects || []).flatMap(p => p.tasks.filter(t => t.text));
  const ktDone = kt.filter(t => t.done).length;
  const trend = avg !== null && prevAvg !== null ? avg - prevAvg : null;

  const byDay = days.map(d => { const l = moods.filter(m => m.dateKey === d); return l.length ? l.reduce((s, m) => s + m.score, 0) / l.length : null; });
  const bars = `<div class="bars">${byDay.map((v, i) => `<div class="b" title="${fmtShort(days[i])}: ${v === null ? '—' : v.toFixed(1)}" style="height:${v === null ? 3 : Math.max(6, v * 10)}%;background:${v === null ? 'var(--empty)' : scoreColor(Math.round(v))}"></div>`).join('')}</div>
    <div class="bars-x"><span>${fmtShort(from)}</span><span>${fmtShort(today)}</span></div>`;

  const high = moods.filter(m => m.score >= 8 && m.why).slice(-4).reverse();
  const low = moods.filter(m => m.score <= 4 && m.why).slice(-4).reverse();
  const trackers = liveTrackers();

  const journalDays = [...new Set(moods.map(m => m.dateKey))].sort().reverse().slice(0, 10);

  return `
  <header class="top"><div class="h-main"><div class="date">Итоги</div><h1>Как ты движешься</h1></div></header>
  <div style="margin:10px 0 4px"><div class="seg">${[7, 30, 90].map(r => `<button class="${r === n ? 'on' : ''}" onclick="setRange(${r})">${r} дней</button>`).join('')}</div></div>

  <section style="margin-top:14px"><div class="kpis">
    <div class="kpi"><div class="v">${activeDays}<span class="muted" style="font-size:16px">/${n}</span></div><div class="l">дней в системе · сейчас 🔥 ${dayStreak()} подряд</div></div>
    <div class="kpi"><div class="v" style="color:${avg === null ? 'inherit' : scoreColor(Math.round(avg))}">${avg === null ? '—' : avg.toFixed(1)}</div><div class="l">среднее состояние${trend !== null ? ` · ${trend >= 0 ? '▲' : '▼'} ${Math.abs(trend).toFixed(1)} к прошлым ${n} дн.` : ''}</div></div>
    <div class="kpi"><div class="v">${cubes}</div><div class="l">${plural(cubes, 'кубик заполнен', 'кубика заполнено', 'кубиков заполнено')}</div></div>
    <div class="kpi"><div class="v">${moods.length ? Math.round(committed / moods.length * 100) + '%' : '—'}</div><div class="l">чек-инов, где ты взял ответственность («иду улучшать»)</div></div>
    ${kt.length ? `<div class="kpi" style="grid-column:1/-1"><div class="row"><div class="v">${ktDone}/${kt.length}</div><div class="l" style="margin-left:6px">ключевых задач ${MONTHS[+mk.slice(5) - 1]} закрыто</div></div><div class="prog"><i style="width:${Math.round(ktDone / kt.length * 100)}%;background:var(--accent)"></i></div></div>` : ''}
  </div></section>

  <section><div class="sec-h"><h2>Состояние по дням</h2><span class="small muted">${moods.length} ${plural(moods.length, 'отметка', 'отметки', 'отметок')}</span></div>
    <div class="card">${moods.length ? bars : '<div class="muted small" style="text-align:center;padding:20px 0">Пока нет отметок. Отметь состояние на вкладке «Сегодня».</div>'}</div>
  </section>

  ${trackers.length ? `<section><div class="sec-h"><h2>Календарики</h2></div><div class="card">
    ${trackers.map(t => { const st = trackerStats(t); return `<div style="margin-bottom:14px">
      <div class="row"><span>${esc(t.emoji || '◼︎')}</span><b style="flex:1;font-size:15px">${esc(t.name)}</b><span class="small" style="font-weight:700">${st.done}/${st.total} · ${st.pct}%</span></div>
      <div class="prog"><i style="width:${st.pct}%;background:${t.color}"></i></div>
      <div class="small ${st.debt ? '' : 'muted'}" style="margin-top:5px;${st.debt ? 'color:var(--warn)' : ''}">${st.debt ? `отставание ${st.debt}` : 'в графике'}${st.streak > 1 ? ` · серия ${st.streak}` : ''}${st.active ? ` · до ${fmtShort(t.endDate)}` : ''}</div>
    </div>`; }).join('')}
  </div></section>` : ''}

  ${high.length || low.length ? `<section><div class="sec-h"><h2>Что на тебя влияет</h2></div>
    ${high.length ? `<div class="card"><div class="lbl2" style="color:var(--accent)">Когда тебе хорошо (8–10)</div>${high.map(m => `<div class="insight">${esc(m.why)} <span class="small muted">· ${fmtShort(m.dateKey)}</span></div>`).join('')}</div>` : ''}
    ${low.length ? `<div class="card"><div class="lbl2" style="color:var(--bad)">Когда тяжело (0–4)</div>${low.map(m => `<div class="insight">${esc(m.why)}${m.action ? `<div class="small muted">→ ${esc(m.action)}</div>` : ''}</div>`).join('')}</div>` : ''}
  </section>` : ''}

  ${journalDays.length ? `<section><div class="sec-h"><h2>Дневник состояния</h2></div><div class="card">
    ${journalDays.map(d => `<div class="journal-day">${esc(fmtLong(d))}</div>${moods.filter(m => m.dateKey === d).sort((a, b) => a.createdAt - b.createdAt).map(m => `
      <div class="jentry"><span class="jscore" style="background:${scoreColor(m.score)}">${m.score}</span>
      <div class="jtext"><b>${SLOT_LABEL[m.slot] || ''}</b>${m.committedAt ? '<span class="tag">✊ сделал шаг</span>' : ''}
        ${m.why ? `<div>${esc(m.why)}</div>` : ''}${m.action ? `<div class="a">→ ${esc(m.action)}</div>` : ''}</div></div>`).join('')}`).join('')}
  </div></section>` : ''}
  <div style="height:12px"></div>`;
}
window.setRange = r => { S.statsRange = r; render(); };

    ['66 дней', today, addDays(today, 65)],
    ['90 дней', today, addDays(today, 89)],
  ];
  const total = d.startDate && d.endDate && d.endDate >= d.startDate ? trackerTarget(d) : 0;
  const [c, g] = cubeSize(total);
  return `<h3>${d._edit ? 'Настройки календарика' : 'Новый календарик'}</h3>
    <div class="field" style="margin-top:0"><label>Что отмечаем</label><input class="in" id="tr-name" placeholder="Тренировка, немецкий, продажа…" value="${esc(d.name)}" oninput="draft.name=this.value"></div>
    <div class="field"><label>Иконка</label><div class="emojis">${EMOJIS.map(e => `<button class="${e === d.emoji ? 'on' : ''}" onclick="draft.emoji='${e}';rerenderEditor()">${e}</button>`).join('')}</div></div>
    <div class="field"><label>Цвет</label><div class="colors">${COLORS.map(c2 => `<button class="${c2 === d.color ? 'on' : ''}" style="background:${c2}" onclick="draft.color='${c2}';rerenderEditor()" aria-label="Цвет"></button>`).join('')}</div></div>
    <div class="field"><label>Регулярность</label>
      <div class="chips">${[['daily', 'Каждый день'], ['weekdays', 'По дням недели'], ['weekly', 'N раз в неделю'], ['total', 'N раз за период']].map(([m, l]) => `<button class="chip ${d.mode === m ? 'on' : ''}" onclick="draft.mode='${m}';rerenderEditor()">${l}</button>`).join('')}</div>
      ${d.mode === 'weekdays' ? `<div class="chips" style="margin-top:10px">${WD.map((w, i) => `<button class="chip ${d.days.includes(i) ? 'on' : ''}" onclick="toggleDay(${i})">${w}</button>`).join('')}</div>` : ''}
      ${d.mode === 'weekly' ? `<div style="margin-top:10px" class="stepper"><button onclick="draft.perWeek=Math.max(1,draft.perWeek-1);rerenderEditor()">−</button><b>${d.perWeek}</b><button onclick="draft.perWeek=Math.min(7,draft.perWeek+1);rerenderEditor()">+</button><span class="muted small">${plural(d.perWeek, 'раз', 'раза', 'раз')} в неделю</span></div>` : ''}
      ${d.mode === 'total' ? `<div style="margin-top:10px" class="row"><input class="in" type="number" min="1" max="5000" style="width:120px" value="${d.target}" oninput="draft.target=Math.max(1,parseInt(this.value)||1);updatePreview()"><span class="muted small">раз за весь период (например, 20 продаж). Можно отмечать несколько раз в день.</span></div>` : ''}
    </div>
    <div class="field"><label>Период</label>
      <div class="chips" style="margin-bottom:10px">${presets.map(([l, a, b]) => `<button class="chip ${d.startDate === a && d.endDate === b ? 'on' : ''}" onclick="draft.startDate='${a}';draft.endDate='${b}';rerenderEditor()">${l}</button>`).join('')}</div>
      <div class="two"><input class="in" type="date" value="${d.startDate}" onchange="draft.startDate=this.value;rerenderEditor()"><input class="in" type="date" value="${d.endDate}" onchange="draft.endDate=this.value;rerenderEditor()"></div>
    </div>
    <div class="field"><label>Зачем мне это (необязательно)</label><input class="in" placeholder="Чтобы сдать экзамен в январе" value="${esc(d.why || '')}" oninput="draft.why=this.value"></div>
    <div class="preview" style="--tc:${d.color}" id="tr-preview">${previewHtml(total, c, g)}</div>
    <div class="ci-actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="saveTracker()">${d._edit ? 'Сохранить' : 'Создать'}</button></div>`;
}
function previewHtml(total, c, g) {
  if (!total) return `<span class="small muted">Проверь даты периода</span>`;
  const shown = Math.min(total, 400);
  return `<div class="row"><b>${total} ${plural(total, 'кубик', 'кубика', 'кубиков')}</b><span class="small muted">${fmtShort(draft.startDate)} – ${fmtShort(draft.endDate)}</span></div>
    <div class="cubes" style="--c:${c}px;--g:${g}px;margin-bottom:0">${'<i class="cube"></i>'.repeat(shown)}</div>`;
}
window.updatePreview = () => { const total = trackerTarget(draft); const [c, g] = cubeSize(total); $('#tr-preview').innerHTML = previewHtml(total, c, g); };
window.rerenderEditor = () => { const y = sheetEl?.scrollTop; setSheet(trackerEditorHtml()); if (sheetEl) sheetEl.scrollTop = y; };
window.toggleDay = i => { draft.days = draft.days.includes(i) ? draft.days.filter(x => x !== i) : [...draft.days, i].sort(); rerenderEditor(); };
window.saveTracker = async () => {
  const d = draft;
  if (!d.name.trim()) { $('#tr-name').focus(); toast('Назови календарик'); return; }
  if (!d.startDate || !d.endDate || d.endDate < d.startDate) { toast('Конец периода раньше начала'); return; }
  if (d.mode === 'weekdays' && !d.days.length) { toast('Выбери хотя бы один день'); return; }
  const body = { name: d.name.trim(), emoji: d.emoji, color: d.color, why: d.why || '', mode: d.mode, days: d.days, perWeek: d.perWeek, target: d.target, startDate: d.startDate, endDate: d.endDate };
  closeSheet();
  try {
    if (d._edit) {
      const { tracker } = await api('trackers/' + d.id, 'PATCH', body);
      const i = S.life.trackers.findIndex(t => t.id === d.id); S.life.trackers[i] = tracker;
    } else {
      const { tracker } = await api('trackers', 'POST', body);
      S.life.trackers.push(tracker);
      toast(`${tracker.emoji} Создано ${trackerTarget(tracker)} ${plural(trackerTarget(tracker), 'кубик', 'кубика', 'кубиков')}`);
    }
    render();
  } catch (e) { fail(e); }
};

// ── Tracker detail (dated calendar to fix past days) ──────────────────────────
window.openTracker = id => {
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  openSheet(trackerDetailHtml(t), { tracker: id });
};
function refreshTrackerSheet(t) { if (sheetCtx?.tracker === t.id) { const y = sheetEl.scrollTop; setSheet(trackerDetailHtml(t)); sheetEl.scrollTop = y; } }
function trackerDetailHtml(t) {
  const st = trackerStats(t);
  const today = todayKey();
  let months = '';
  let mk = monthKey(t.startDate);
  const lastMk = monthKey(t.endDate);
  while (mk <= lastMk) {
    const first = mk + '-01';
    const last = endOfMonth(first);
    let cells = WD.map(w => `<div class="wd">${w}</div>`).join('');
    for (let i = 0; i < weekday(first); i++) cells += `<button class="out" disabled></button>`;
    for (let d = first; d <= last; d = addDays(d, 1)) {
      const inP = d >= t.startDate && d <= t.endDate;
      const v = (t.log || {})[d] || 0;
      const future = d > today;
      const cls = [!inP ? 'off' : '', v ? 'f' : '', inP && !isScheduled(t, d) ? 'nosched' : '', d === today ? 'td' : ''].join(' ');
      cells += `<button class="${cls}" ${!inP || future ? 'disabled' : ''} onclick="calTap('${t.id}','${d}')">${+d.slice(8)}${v > 1 ? `<span class="cnt">×${v}</span>` : ''}</button>`;
    }
    months += `<div class="cal-month">${MONTHS_NOM[+mk.slice(5) - 1]}</div><div class="cal">${cells}</div>`;
    mk = shiftMonth(mk, 1);
  }
  return `<div style="--tc:${t.color}">
    <div class="tr-head" style="cursor:default"><div class="tr-emoji" style="background:${t.color}22">${esc(t.emoji || '◼︎')}</div>
      <div class="tr-title"><div class="tr-name" style="font-size:20px">${esc(t.name)}</div><div class="tr-meta">${esc(regularityText(t))} · ${fmtShort(t.startDate)} – ${fmtShort(t.endDate)}</div></div>
      <div class="tr-count"><b>${st.done}</b><span>из ${st.total}</span></div></div>
    ${renderCubes(t, st)}
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="v" style="font-size:22px">${st.pct}%</div><div class="l">выполнено</div></div>
      <div class="kpi"><div class="v" style="font-size:22px">${st.streak}</div><div class="l">серия</div></div>
      <div class="kpi"><div class="v" style="font-size:22px;${st.debt ? 'color:var(--warn)' : ''}">${st.debt}</div><div class="l">отставание</div></div>
    </div>
    <p class="small muted" style="margin:16px 0 0">Забыл отметить? Нажми на день в календаре${t.mode === 'total' ? ' — каждое нажатие +1, долгое нажатие сбрасывает' : ''}.</p>
    ${months}
    <div class="ci-actions" style="margin-top:18px">
      <button class="btn" onclick="closeSheet();openTrackerEditor('${t.id}')">Настройки</button>
      <button class="btn" onclick="archiveTracker('${t.id}')">В архив</button>
    </div>
    <div class="ci-actions"><button class="btn ghost danger" onclick="deleteTracker('${t.id}')">Удалить навсегда</button></div>
  </div>`;
}
let pressTimer = null, pressed = false;
window.calTap = (id, d) => {
  if (pressed) { pressed = false; return; }
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  setMark(t, d, t.mode === 'total' ? 1 : undefined);
};
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.cal button'); if (!b || !sheetCtx?.tracker) return;
  pressTimer = setTimeout(() => {
    const t = S.life.trackers.find(x => x.id === sheetCtx.tracker);
    const m = (b.getAttribute('onclick') || '').match(/'(\d{4}-\d{2}-\d{2})'/);
    if (t && m && t.mode === 'total' && (t.log || {})[m[1]]) { pressed = true; setMark(t, m[1], -t.log[m[1]]); }
  }, 550);
});
document.addEventListener('pointerup', () => clearTimeout(pressTimer));
document.addEventListener('pointercancel', () => clearTimeout(pressTimer));
window.archiveTracker = async id => {
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  t.archived = true; closeSheet(); render(); toast('Убрано в архив — вернуть можно в настройках');
  try { await api('trackers/' + id, 'PATCH', { archived: true }); } catch (e) { fail(e); }
};
window.restoreTracker = async id => {
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  t.archived = false; render(); openSettings();
  try { await api('trackers/' + id, 'PATCH', { archived: false }); } catch (e) { fail(e); }
};
window.deleteTracker = async id => {
  const t = S.life.trackers.find(x => x.id === id); if (!t) return;
  if (!confirm(`Удалить «${t.name}» вместе со всеми отметками?`)) return;
  S.life.trackers = S.life.trackers.filter(x => x.id !== id); closeSheet(); render();
  try { await api('trackers/' + id, 'DELETE'); } catch (e) { fail(e); }
};

// ── Settings ──────────────────────────────────────────────────────────────────
window.openSettings = () => {
  const archived = S.life.trackers.filter(t => t.archived);
  const pushState = !('Notification' in window) ? 'unsupported' : Notification.permission;
  openSheet(`<h3>Настройки</h3>
    <div class="card">
      <div class="lbl2">Уведомления</div>
      <div class="small" style="line-height:1.5">3 раза в день — в 7:00, 13:00 и 21:00 (МСК) — придёт вопрос «Как ты сейчас?»: в браузер и в Telegram-бота (там можно ответить прямо кнопками 0–10). В боте также работает команда /mood.</div>
      <div style="margin-top:12px">${pushState === 'granted' ? '<span class="small" style="color:var(--accent);font-weight:600">✓ Уведомления в браузере включены</span>'
        : pushState === 'denied' ? '<span class="small muted">Уведомления заблокированы браузером — разреши их в настройках сайта.</span>'
        : pushState === 'unsupported' ? '<span class="small muted">Этот браузер не поддерживает уведомления. На iPhone — добавь страницу на экран «Домой».</span>'
        : '<button class="btn sm primary" onclick="enablePush()">Включить уведомления</button>'}</div>
    </div>
    <div class="card"><div class="lbl2">Мой стандарт</div><button class="btn sm" onclick="editManifesto()">Изменить текст</button></div>
    ${archived.length ? `<div class="card"><div class="lbl2">Архив календариков</div>${archived.map(t => `<div class="list-row"><span>${esc(t.emoji)}</span><div class="grow"><b>${esc(t.name)}</b><div class="small muted">${trackerDone(t)}/${trackerTarget(t)} · ${fmtShort(t.startDate)} – ${fmtShort(t.endDate)}</div></div><button class="btn sm" onclick="restoreTracker('${t.id}')">Вернуть</button></div>`).join('')}</div>` : ''}
    <div class="card"><div class="lbl2">Другие разделы</div>
      <div class="list-row"><div class="grow"><b>Трекер задач</b><div class="small muted">Старая доска задач, проектов и фокуса дня</div></div><a class="btn sm" href="/mylife/tasks/">Открыть</a></div>
      <div class="list-row"><div class="grow"><b>Немецкий</b><div class="small muted">Тренажёр A1</div></div><a class="btn sm" href="/deutsch/">Открыть</a></div>
    </div>
    <div class="ci-actions"><button class="btn block" onclick="closeSheet()">Готово</button></div>`);
};

// ── Push notifications ────────────────────────────────────────────────────────
function b64ToBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function subscribePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const kr = await fetch('/mylife/api/push/vapid-key'); if (!kr.ok) return false;
    const { key } = await kr.json(); if (!key) return false;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    await fetch('/mylife/api/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subscription: sub.toJSON() }) });
    return true;
  } catch (e) { console.warn('push', e); return false; }
}
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function pushBannerHtml() {
  if (!pushSupported() || Notification.permission !== 'default') return '';
  try { if (localStorage.getItem('mylife:pushLater') === todayKey()) return ''; } catch {}
  return `<div class="banner"><div class="grow">Включи уведомления — 3 раза в день спрошу, как ты.</div><button class="btn sm primary" onclick="enablePush()">Включить</button><button class="x" onclick="pushLater()" aria-label="Позже">✕</button></div>`;
}
window.pushLater = () => { try { localStorage.setItem('mylife:pushLater', todayKey()); } catch {} render(); };
window.enablePush = async () => {
  const perm = await Notification.requestPermission();
  if (perm === 'granted') { const ok = await subscribePush(); toast(ok ? 'Уведомления включены 🔔' : 'Не получилось подписаться на уведомления'); }
  if (sheetEl) openSettings();
  render();
};
if (pushSupported()) {
  navigator.serviceWorker.register('/mylife/sw.js').then(() => { if (Notification.permission === 'granted') subscribePush(); }).catch(() => {});
}

// Day rolled over while the page was open → re-render so "today" moves.
let lastDay = todayKey();
setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); S.ci = null; render(); } }, 60e3);

load();
</script>
</body>
</html>
