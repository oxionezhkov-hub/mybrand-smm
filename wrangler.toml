name = "tasktracker"
main = "worker.js"
compatibility_date = "2024-01-01"
preview_urls = false

[[kv_namespaces]]
binding = "KV"
id = "5ffa6fc542054098b122fb4f4c254076"

[ai]
binding = "AI"

# Secrets required (set via `wrangler secret put <name>`), not stored here:
#   TG_TOKEN            — Telegram bot token
#   OWNER_CHAT_ID        — Telegram chat id allowed to use the bot
#   CLAUDE_API           — Anthropic API key (currently unused — the worker is
#                          temporarily routed entirely through the free Llama
#                          model on Workers AI; see callClaude/callClaudeStreaming/
#                          callClaudeCoach in worker.js)
#   CCR_TRIGGER_URL      — "Call via API" endpoint URL for the Claude Code
#                          Remote Routine "Zoom transcript → decisions summary"
#                          (see handleTranscriptDocument in worker.js). Find it
#                          on the Routine's trigger settings at claude.ai/code.
#   CCR_TRIGGER_TOKEN    — bearer token for that same "Call via API" trigger.
#   SUPADATA_API_KEY     — YouTube transcript API key
#   MYLIFE_MCP_TOKEN     — bearer token for the /mylife/mcp endpoint
#   VIDEO_MCP_TOKEN      — bearer token for the /video/mcp endpoint (video transcription connector)
#   VAPID_PRIVATE_JWK    — JSON Web Key for browser push (see pushBroadcast in worker.js),
#                          e.g. {"crv":"P-256","kty":"EC","x":"...","y":"...","d":"..."}
#   VAPID_SUBJECT        — optional, e.g. "mailto:you@example.com" (defaults to a placeholder)
#   INBOX_TG_TOKEN       — second Telegram bot's token (from @BotFather), used by the
#                          /message inbox (see "Inbox (second Telegram bot)" in worker.js).
#                          Unlike the main bot above, this bot is NOT owner-only — anyone
#                          who messages it gets captured. After setting it, register its
#                          webhook once by visiting /debug/inbox-setwebhook?token=<TG_TOKEN>.
#   INBOX_TG_WEBHOOK_SECRET — optional random string; if set, verified against Telegram's
#                          secret_token header on /inbox/webhook (also auto-sent to
#                          setWebhook by /debug/inbox-setwebhook).
#   INBOX_ACCESS_TOKEN   — required to use the /message page and its API at all (fails
#                          closed if unset). Any long random string — the page asks for
#                          it once and remembers it in the browser (localStorage).
#   ZOOM_ACCOUNTS_JSON   — JSON array configuring the Zoom → Telegram recording/transcript
#                          forwarder (see "Zoom → Telegram" in worker.js). One entry per
#                          Zoom account, each with its own Server-to-Server OAuth app and
#                          its own webhook Secret Token:
#                          [{"label":"account-1","account_id":"...","client_id":"...",
#                            "client_secret":"...","webhook_secret_token":"...",
#                            "chat_id":"-100xxxxxxxxx"}, ...]
#                          `chat_id` is optional per account — omit it to send to OWNER_CHAT_ID.
#                          In each Zoom account's app, set Event Subscriptions' endpoint URL to
#                          https://<worker-domain>/zoom/webhook/<label> (label must match, and
#                          must be unique/URL-safe) and subscribe to "Recording Completed" and
#                          "All Recordings have completed Transcription". Not set = feature is
#                          simply inert (getZoomAccounts returns an empty list).

[vars]
# Set to "true" to disable the morning Telegram summary and all three daily
# browser push nudges.
MAILINGS_PAUSED = "false"

# All cron schedules the Worker's scheduled() handler dispatches on (see
# handleScheduled in worker.js). Kept complete here so a `wrangler deploy`
# doesn't drop schedules that existed only in the dashboard before.
[triggers]
crons = [
  "0 4 * * *",   # 07:00 MSK daily — Telegram task summary + "open your tasks" push
  "0 10 * * *",  # 13:00 MSK daily — "update your tasks" push
  "0 18 * * *",  # 21:00 MSK daily — "plan tomorrow" push
  "0 6 * * *",   # 09:00 MSK daily — Entrepreneur content summary
  "*/5 * * * *", # every 5 min — Zoom transcript-polling fallback (checkPendingZoomTranscripts),
                 # for meetings whose recording.transcript_completed webhook never fires
]

# Static presentation deck (public/vebinar-slides/index.html) served at /vebinar-slides.
# Matched assets are served directly by Cloudflare; everything else (webhook, /debug/morning, /)
# falls through to the Worker script below.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
